name: tests

on:
  push:
    branches: [main]
  pull_request:

# Token só de leitura: nenhum job deste workflow precisa escrever no repositório.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Identidade do git (testes criam repos falsos e commitam)
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
      - name: TUI opcional (hashes travados) — ativa os testes do cockpit
        run: pip install -r requirements-tui.txt
      - name: unittest discover (todos os arquivos de tests/, sem rede)
        run: python -m unittest discover -s tests -v
