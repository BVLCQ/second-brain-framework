# CI — GitHub Actions nos runners hospedados do GitHub (`ubuntu-24.04`, máquina nova para cada job).
# O repositório é público, e nele os runners padrão do GitHub são gratuitos: não há minuto a poupar.
#
# Dois eventos de PR, um de cada lado da fronteira de confiança:
#
# pull_request_target roda o PORTÃO DE DADOS, com o workflow da main — não o do PR: nenhum PR
# consegue enfraquecer o próprio portão. O que o PR acrescenta à main passa pela varredura do
# `brain upstream scan` mais uma lista privada de termos, que mora num segredo do repositório
# (`PUBLIC_DENYLIST_B64`) e nunca vai ao código. Só texto entra (o job não executa nada que venha
# do PR), por isso roda para PR de fork também.
#
# pull_request roda a SUÍTE, que executa o código do PR, em Python 3.11–3.14 — para PR de fork
# também: a máquina é do GitHub e descartável, o job não recebe segredo, e o token do job é só de
# leitura e sai do ar antes da suíte.
#
# push em main: os dois, sobre o que acabou de entrar. Os dois jobs são independentes: ficam em
# execuções diferentes, e o que segura o merge é a proteção da main exigir os dois.
#
# Nenhum job em runner próprio: o workflow do `pull_request` é o do PR, e quem abre o PR escolhe
# onde o job roda — num repositório público isso entrega a máquina do mantenedor a qualquer fork.
# `tests/test_ci_hardening.py` trava isso.
#
# Sem actions em JavaScript (nenhum checkout@v4): o checkout é git puro com o token do job, e a
# imagem `python:` oficial já traz git. O que ela não traz é o `node`, que os testes do painel
# precisam para avaliar o JavaScript: entra um tarball oficial, com versão e checksum fixados aqui.
name: CI

on:
  pull_request:
  pull_request_target:
  push:
    branches: [main]

# Um push novo cancela a execução anterior do mesmo PR; em main, nunca.
# O grupo leva o evento: em pull_request_target o `github.ref` é o da main, e sem isso todos os PRs
# cairiam num grupo só, e a execução da suíte cancelaria a do portão.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# token só de leitura: nenhum job precisa escrever neste repositório
permissions:
  contents: read

jobs:
  data-gate:
    name: data-gate
    # push em main e pull_request_target (workflow da main). Nunca no `pull_request`, que é o do PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: python:3.12
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
      # o commit a varrer e a base: em PR, a ponta do branch contra a main; em push, o que acabou de entrar
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GATE_BASE: ${{ github.event.pull_request.head.sha && 'origin/main' || github.event.before }}
    steps:
      - name: Checkout da main (quem varre é a main, não o PR)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init -q
          git config http.extraheader "AUTHORIZATION: basic $(echo -n "x-access-token:$GITHUB_TOKEN" | base64 -w0)"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch -q --no-tags origin "+refs/heads/main:refs/remotes/origin/main" "$TARGET_SHA"
          git checkout -q --force origin/main
      - name: Portão de dados (o que entra na main)
        env:
          # a lista privada chega só a este job, que não executa nada do PR; o job da suíte não a recebe
          PUBLIC_DENYLIST_B64: ${{ secrets.PUBLIC_DENYLIST_B64 }}
        run: |
          # A varredura procura o caminho do HOME no diff. O do container (/root) é caminho de servidor
          # que documentação legítima cita: passa a ser uma pasta dentro do workspace.
          export HOME="$PWD/.home-do-portao"
          case "$GATE_BASE" in
            0000000000000000000000000000000000000000) echo "push sem base conhecida: não dá para varrer só o que entrou"; exit 1 ;;
          esac
          # O segredo é o arquivo da lista privada em base64: vira um arquivo 0600 que só este job lê
          # e sai com ele. Sem a lista o portão falha — ele não atesta nada.
          umask 077
          LISTA="$(mktemp)"
          trap 'rm -f "$LISTA"' EXIT
          printf '%s' "$PUBLIC_DENYLIST_B64" | base64 -d > "$LISTA"
          # o PR entra por um worktree: os scripts que varrem são os da main, o PR só fornece os commits
          git worktree add --detach /tmp/entrada "$TARGET_SHA"
          python3 scripts/dev/public_gate.py gate --root /tmp/entrada --base "$GATE_BASE" --denylist "$LISTA"

  tests:
    name: tests (py${{ matrix.python }})
    # a suíte executa o código do PR — de qualquer PR, inclusive de fork: o job não recebe segredo
    # e a máquina é do GitHub, nova para cada job
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    container:
      image: python:${{ matrix.python }}
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    steps:
      - name: Checkout (git puro, com o token do job)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init -q
          git config http.extraheader "AUTHORIZATION: basic $(echo -n "x-access-token:$GITHUB_TOKEN" | base64 -w0)"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch -q --depth=1 --no-tags origin "+$GITHUB_SHA:refs/remotes/origin/ci"
          git checkout -q --force refs/remotes/origin/ci
          git config --unset http.extraheader
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || { echo "HEAD não é GITHUB_SHA"; exit 1; }
      - name: Identidade do git (testes criam repos falsos e commitam)
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
      - name: TUI opcional (hashes travados) — ativa os testes do cockpit
        run: pip install --no-cache-dir --require-hashes -r requirements-tui.txt
      - name: Node (os testes do painel avaliam o JavaScript, e a imagem não o traz)
        run: |
          ARCH="$(uname -m)"
          case "$ARCH" in aarch64|arm64) N=arm64 ;; x86_64) N=x64 ;; *) echo "arquitetura sem build do node: $ARCH"; exit 1 ;; esac
          V=v22.23.1
          F="node-$V-linux-$N.tar.xz"
          curl -fsSL -m 120 "https://nodejs.org/dist/$V/$F" -o "/tmp/$F"
          printf '%s  %s\n' \
            0294e8b915ab75f92c7513d2fcb830ae06e10684e6c603e99a87dbf8835389c1  node-v22.23.1-linux-arm64.tar.xz \
            9749e988f437343b7fa832c69ded82a312e41a03116d766797ac14f6f9eee578  node-v22.23.1-linux-x64.tar.xz > /tmp/node-shasums
          (cd /tmp && sha256sum --ignore-missing -c node-shasums)
          tar -xJ -f "/tmp/$F" -C /opt --strip-components=1
          ln -sf /opt/bin/node /usr/local/bin/node
          rm -f "/tmp/$F" /tmp/node-shasums
          node --version
      - name: unittest discover (todos os arquivos de tests/, sem rede)
        # O token do job é do passo do checkout, em `env` próprio. Aqui ele sai do ambiente de vez:
        # `config.load_env` dá ao ambiente a precedência sobre o config/.env, e com o token do job no
        # ar um teste que grava um token falso no .env leria o real.
        env:
          GITHUB_TOKEN: ""
        run: python -m unittest discover -s tests
