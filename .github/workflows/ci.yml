name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: TUI opcional (hashes travados) — ativa os testes do cockpit
        run: pip install -r requirements-tui.txt
      - name: unittest discover (todos os arquivos de tests/, sem rede)
        run: python -m unittest discover -s tests -v
