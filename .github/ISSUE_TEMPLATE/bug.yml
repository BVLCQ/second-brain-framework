name: 'Bug'
description: 'Algo do Segundo Cérebro não funciona como deveria'
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: 'Este repositório é público. Não inclua nomes de pessoas, e-mails, telefones, links internos (Drive, Slack, Jira…), prints ou números reais da sua empresa. Para exemplos use a padaria fictícia (`marina-demo`, "Padaria Pão Quente", `contato@example.com`).'
  - type: input
    id: resumo
    attributes:
      label: 'Resumo'
      description: 'Uma frase: o que quebra.'
    validations:
      required: true
  - type: textarea
    id: obtido
    attributes:
      label: 'O que aconteceu'
      description: 'O comportamento errado, com a mensagem de erro (sem dados reais).'
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: 'O que era esperado'
      description: 'O que deveria acontecer.'
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: 'Como reproduzir'
      description: 'Passos numerados com dados fictícios da padaria (ex.: `brain action open "Conferir o forno" --owner marina-demo`).'
      value: '1. 
2. 
3. '
    validations:
      required: true
  - type: textarea
    id: ambiente
    attributes:
      label: 'Ambiente'
      description: 'Versão do brain (`brain --version`) e sistema operacional.'
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 'Trecho do log'
      description: 'Só o trecho relevante, já sem nomes, e-mails, caminhos ou links reais. Sem prints.'
    validations:
      required: false
  - type: checkboxes
    id: privacidade
    attributes:
      label: Privacidade
      options:
        - label: 'Revisei o texto: não há dado real (pessoas, e-mails, prints, links internos). Os exemplos usam dados fictícios.'
          required: true
