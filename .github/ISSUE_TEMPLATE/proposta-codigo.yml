name: 'Proposta de código'
description: 'Mudança de código ou estrutura do framework'
title: '[sugestão] '
labels: ['sugestão', 'enhancement']
body:
  - type: markdown
    attributes:
      value: 'Este repositório é público. Não inclua nomes de pessoas, e-mails, telefones, links internos (Drive, Slack, Jira…), prints ou números reais da sua empresa. Para exemplos use a padaria fictícia (`marina-demo`, "Padaria Pão Quente", `contato@example.com`).'
  - type: input
    id: resumo
    attributes:
      label: 'Resumo'
      description: 'Uma ou duas frases: o que muda no framework.'
    validations:
      required: true
  - type: textarea
    id: contexto
    attributes:
      label: 'Contexto'
      description: 'Por que agora: o problema geral, sem citar o caso do dono.'
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: 'Proposta'
      description: 'O que muda: comandos, arquivos, comportamento.'
    validations:
      required: true
  - type: textarea
    id: fora
    attributes:
      label: 'Fora do escopo'
      description: 'O que não entra nesta mudança.'
    validations:
      required: false
  - type: textarea
    id: aceite
    attributes:
      label: 'Critérios de aceite'
      description: 'Lista do que precisa valer para considerar pronto.'
    validations:
      required: true
  - type: checkboxes
    id: privacidade
    attributes:
      label: Privacidade
      options:
        - label: 'Revisei o texto: não há dado real (pessoas, e-mails, prints, links internos). Os exemplos usam dados fictícios.'
          required: true
