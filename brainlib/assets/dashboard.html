<style>/* VARIANTE B — App lateral: sidebar fixa, ⌘K com ponte CLI (./brain serve). */
:root{
  --sug:#c2255c; --dsug:#6741d9;
  --bg:#f4f5f7; --panel:#ffffff; --ink:#191c22; --muted:#525a67; --line:#e5e8ee; --line2:#eff1f5;
  --accent:#3b5bdb; --accent-ink:#fff;
  --ok:#1e6b31; --okbg:#e7f6ec; --warn:#9a4d00; --warnbg:#fdf0e0; --risk:#b41e28; --riskbg:#fcebec;
  --info:#14599b; --infobg:#e7f1fb; --chip:#eef0f4; --chip2:#e3e6ec;
  --chart-a:#40c057; --chart-b:#91a7ff;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.07);
  --shadow-lg:0 12px 32px rgba(16,24,40,.18);
  --backdrop:rgba(10,12,16,.38); --console-shadow:-8px 0 24px rgba(16,24,40,.08);
  --r:12px; --side:236px;
}
html[data-theme=dark]{
  --sug:#f06595; --dsug:#b197fc;
  --bg:#0d0f13; --panel:#151922; --ink:#e7eaef; --muted:#8f99a8; --line:#252b38; --line2:#1d232e;
  --accent:#748ffc; --accent-ink:#0d0f13;
  --ok:#4dab6f; --okbg:#142d1e; --warn:#f5a623; --warnbg:#33260f; --risk:#f27272; --riskbg:#3a1c1e;
  --info:#5c9df2; --infobg:#152a41; --chip:#1f2530; --chip2:#2a3140;
  --chart-a:#51cf66; --chart-b:#8193f8;
  --shadow:none; --shadow-lg:0 12px 32px rgba(0,0,0,.55);
  --backdrop:rgba(0,0,0,.55); --console-shadow:-8px 0 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif}
html[data-theme=dark] body{color-scheme:dark}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
a[href^="#person/"]{position:relative;display:inline-block}
a[href^="#person/"]::after{content:"";position:absolute;inset:-6px -2px}
::selection{background:var(--accent);color:var(--accent-ink)}
.num,table b,.kpi b{font-variant-numeric:tabular-nums}

/* ── layout: sidebar + conteúdo ── */
.shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
aside.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:14px 12px;gap:4px;scrollbar-width:thin}
.side .brand{display:flex;gap:10px;align-items:center;font-weight:700;padding:6px 8px 14px}
.brand .mark{width:30px;height:30px;border-radius:8px;object-fit:cover;
  display:inline-flex;align-items:center;justify-content:center;color:var(--accent-ink);font-size:12.5px;font-weight:800;flex:none}
.brand small{font-weight:400;color:var(--muted);font-size:11.5px;display:block}
nav.side-nav{display:flex;flex-direction:column;gap:2px}
nav.side-nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;color:var(--muted);
  font-size:14px;font-weight:500;white-space:nowrap}
nav.side-nav a:hover{text-decoration:none;color:var(--ink);background:var(--line2)}
nav.side-nav a.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);font-weight:650}
nav.side-nav .badge{margin-left:auto;min-width:17px;padding:0 5px;border-radius:9px;background:var(--riskbg);color:var(--risk);
  font-size:10.5px;font-weight:700;text-align:center}
.kbtn{margin:10px 6px 4px;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;border:1px dashed var(--line);
  color:var(--muted);font-size:12.5px;cursor:pointer;background:transparent}
.kbtn:hover{border-color:var(--accent);color:var(--accent)}
.kbtn b{margin-left:auto;font:11.5px ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:2px 5px}
.side .spacer{flex:1}
.bridge{margin:6px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
.bridge:hover{border-color:var(--accent)}
.bridge .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:7px;vertical-align:0}
.bridge.live .dot{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.bridge b{font-size:12.5px}
.bridge small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;width:32px;height:32px;
  cursor:pointer;font-size:14px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.iconbtn:hover{color:var(--accent);border-color:var(--accent)}
.iconbtn.is-dark{filter:invert(60%)}
.side .foot-row{display:flex;gap:8px;align-items:center;padding:6px}
.ownerchip{display:flex;gap:8px;align-items:center;min-width:0}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--chip2);display:inline-flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:700;color:var(--muted);flex:none}
.ownerchip small{color:var(--muted);display:block;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

main.col{min-width:0;padding:22px 28px 120px}
.content{max-width:1200px;margin:0 auto}

/* ── página ── */
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:2px 0 14px;flex-wrap:wrap}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
h2.sec{font-size:16px;margin:26px 0 10px}
.pagehead .sub{margin:4px 0 0;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:14px}
.crumb{margin:14px 0 -6px}
.muted{color:var(--muted)}.small{font-size:12.5px}.more{margin:10px 0 0;font-size:14px}
.sug{color:var(--sug);font-weight:600}.dsug{color:var(--dsug);font-weight:600}.dsug em{font-style:normal;opacity:.85}
.late{color:var(--risk);font-weight:600}.soon{color:var(--warn);font-weight:600}.ok{color:var(--ok)}

/* ── kpis ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin:0 0 14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi span{display:block;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-bottom:4px}
.kpi b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em}
.kpi.ok::after,.kpi.risk::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.kpi.ok::after{background:var(--ok)}.kpi.risk::after{background:var(--risk)}
.kpi.ok b{color:var(--ok)}.kpi.risk b{color:var(--risk)}

/* ── painéis ── */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
h2{font-size:16px;margin:18px 0 10px}.panel > h2:first-child{margin-top:0}
.panel[data-priority]{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
h3.day{font-size:11.5px;margin:16px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.panel h3.day:first-child{margin-top:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(400px,100%),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr))}
.mx{grid-template-columns:repeat(2,minmax(0,1fr))}
.panel,.grid>*,.projcard,.col{min-width:0}

/* ── chips / ids ── */
.chip{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;
  background:var(--chip);color:var(--muted);white-space:nowrap;vertical-align:1px}
.h-em-risco{background:var(--riskbg);color:var(--risk)}.h-travado,.h-atencao{background:var(--warnbg);color:var(--warn)}
.h-em-dia,.h-concluido{background:var(--okbg);color:var(--ok)}.h-info{background:var(--infobg);color:var(--info)}
.idchip{font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--chip);color:var(--ink);
  padding:1px 7px;border-radius:6px;letter-spacing:.02em;white-space:nowrap;display:inline-block}
.td-ice{white-space:nowrap}
a:hover .idchip{background:var(--accent);color:var(--accent-ink)}

/* ── barras / donuts ── */
.bar{display:inline-block;width:110px;height:7px;border-radius:5px;background:var(--chip2);vertical-align:middle;margin-right:8px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:5px}
.donut text{fill:var(--ink);font-size:11.5px;font-weight:700}
.goal-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.goal-head>div{min-width:0;flex:1}
.goal{border-left:3px solid var(--accent)}
.goal .proj{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.goal .proj:first-of-type{margin-top:10px}
.goal .proj .t{flex:1;min-width:0}.goal .proj .t small{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;white-space:normal;overflow:hidden;color:var(--muted)}
.projcard-head{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.projcard .foot{margin-top:10px;padding-top:10px;border-top:1px solid var(--line2)}
.projcard{display:flex;flex-direction:column;justify-content:space-between}

/* ── listas ── */
ul.feed{list-style:none;padding:0;margin:0}
ul.feed li{padding:8px 2px;border-bottom:1px solid var(--line2);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card-title,ul.feed li{overflow-wrap:anywhere}
ul.feed li:last-child{border:0}
/* #96: alvos de clique ≥24px (WCAG 2.5.8) — links de ação do feed, chips-âncora e chips de ID */
.feed li>a,a.chip,a.idchip{min-height:24px;display:inline-flex;align-items:center}
/* #100: ações do feed (decidir/ver/revisar) com classe própria — varrer e ajustar sem pegar links de texto corrido */
.feed a.feed-act{color:var(--accent);text-decoration:none}
.feed a.feed-act:hover{text-decoration:underline}
ul.feed li.warn{background:linear-gradient(90deg,color-mix(in srgb,var(--warn) 7%,transparent),transparent);border-radius:8px;padding-left:8px}
ul.feed li.info{background:linear-gradient(90deg,color-mix(in srgb,var(--info) 6%,transparent),transparent);border-radius:8px;padding-left:8px}
.health li{padding:8px 2px}.health .hicon{display:inline-block;width:20px;font-weight:700}

/* ── tabelas ── */
.twrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
th{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--panel)}
tbody tr:hover td{background:var(--line2)}
tr.sup td{color:var(--muted);text-decoration:line-through}
.src-group-hdr td{background:var(--chip);font-weight:600;padding:8px 10px;border-top:1px solid var(--line2)}
tbody tr.src-group-hdr:hover td{background:var(--chip)}
.src-group-title{display:inline-flex;align-items:center;gap:8px}
.src-group-name{font-weight:700;color:var(--ink)}
.src-group-count{color:var(--muted);font-size:12.5px;font-weight:500}
.src-th-toggle{width:32px;text-align:center}
.src-td-toggle{width:32px;text-align:center;vertical-align:middle}
.src-toggle{accent-color:var(--accent);width:16px;height:16px;cursor:pointer;vertical-align:middle}
.src-sort-hdr{cursor:pointer;user-select:none}
.src-sort-hdr:hover{color:var(--ink)}
tr.src-disabled{opacity:.55}
tr.src-problem td{background:color-mix(in srgb,var(--riskbg) 35%,transparent)}
tbody tr.src-problem:hover td{background:color-mix(in srgb,var(--riskbg) 55%,transparent)}

/* ── kanban ── */
/* 5 colunas: Depois (adiadas, mais estreita) · A fazer · Fazendo · Bloqueada/aguardando · Feita */
.kanban{display:grid;grid-template-columns:minmax(0,.8fr) repeat(4,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:1300px) and (min-width:901px){.kanban{grid-template-columns:repeat(3,minmax(0,1fr))}}
.col.col-later{background:transparent;border:1px dashed var(--line)}
.card.is-parked{opacity:.82}
.card.is-parked:hover{opacity:1}
/* visão geral do TODO: aberta = cartões; recolhida = uma linha */
.todo-ov{margin:0 0 12px}
.todo-ov-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.todo-ov-line{display:flex;gap:4px 14px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
.todo-ov-line b{color:var(--ink);font-variant-numeric:tabular-nums}
.ovp.risk b{color:var(--risk)}.ovp.ok b{color:var(--ok)}
.todo-ov.is-open .todo-ov-line{display:none}
.todo-ov #todo-ov-cards{display:none;margin:10px 0 0}
.todo-ov.is-open #todo-ov-cards{display:grid}
.todo-ov .kpis{grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.todo-ov .kpi{padding:10px 12px;appearance:none;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.todo-ov .kpi b{font-size:20px}
.todo-ov .kpi.is-on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.todo-ov.is-filtering .kpi.is-off{opacity:.45}
.todo-ov .kpi:focus-visible,.todo-ov-line .ovp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.todo-ov-line .ovp{border:0;background:none;padding:0;margin:0;cursor:pointer;font:inherit;color:inherit}
.todo-ov-line .ovp.is-on{color:var(--accent)}
.kpi.later b{color:var(--muted)}
.col{background:var(--chip);border-radius:var(--r);padding:10px;min-height:120px}
.col h2, .col h3{margin:2px 4px 10px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700;
  display:flex;justify-content:space-between;align-items:center}
.col .count{background:var(--panel);border-radius:999px;padding:0 8px;font-size:11.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);
  transition:transform .12s ease, box-shadow .12s ease}
.card:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.card.is-late{border-left:3px solid var(--risk)}
.card header{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card-title{font-weight:600;margin:5px 0 3px;font-size:14px}
/* #98: <small> explícito na escala fechada — sem isto o UA aplica 13,33×0,833 e cada pai gera um tamanho
   diferente (11,11px no pill do console, 11,67px no card de goal) */
small{font-size:11.5px}
.card-meta{font-size:12.5px;color:var(--muted);margin:0}
.card-block{font-size:12.5px;color:var(--risk);margin:6px 0 0}
.card .qa{margin-top:8px;display:none;gap:6px}
body.bridge-live .card .qa{display:flex}
.card.mini{padding:8px 10px}

/* ── carrossel de faces (‹ face atual ›) — tamanho constante com qualquer nº de faces ── */
.faces{display:flex;gap:3px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;margin:0 2px 12px}
.faces button{border:0;background:transparent;color:var(--muted);font-family:inherit;font-weight:600;border-radius:8px;cursor:pointer;line-height:1.2}
.faces .fnav{flex:0 0 24px;font-size:14px;padding:6px 0}
.faces .fcur{flex:1 1 auto;min-width:0;font-size:12.5px;padding:7px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}
.faces .fnav:hover{color:var(--ink);background:var(--panel)}
.faces button small{display:block;font-weight:500;letter-spacing:0;font-size:10.5px;color:var(--muted);margin-top:2px}

/* ── kanban de oportunidades ── */
.pf-kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(196px,1fr);gap:12px;align-items:start;overflow-x:auto;padding-bottom:8px}
.pf-kanban.lat-row{grid-auto-columns:minmax(280px,1fr);margin-top:12px}
.pf-col.lat{background:transparent;border:1px dashed var(--line);opacity:.9}
.pf-col.lat h2, .pf-col.lat h3{color:var(--muted)}
.pf-card.is-sug{border-left:3px solid var(--sug)}
a.card{display:block;color:var(--ink)}
a.card:hover{text-decoration:none;border-color:var(--accent)}
.card.area-card{color:var(--ink)}
.s-ideia,.s-triagem{background:var(--chip);color:var(--muted)}.s-priorizada{background:var(--infobg);color:var(--info)}
.s-em-andamento,.s-piloto,.s-validando{background:var(--warnbg);color:var(--warn)}.s-entregue{background:var(--okbg);color:var(--ok)}
.s-em-espera{background:var(--chip);color:var(--ink)}.s-descartada{background:var(--riskbg);color:var(--risk)}
.rin{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;font-size:14px;margin-bottom:10px}



/* ── entregáveis e progresso ── */
.dmark{border:1.5px solid var(--muted);background:transparent;color:var(--muted);border-radius:50%;width:24px;height:24px;
  cursor:pointer;font-size:12.5px;line-height:1;padding:0;display:inline-flex;align-items:center;justify-content:center;vertical-align:-6px}
.dmark:hover{border-color:var(--accent);color:var(--accent)}
.dmark.is-done{border-color:var(--ok);color:var(--ok)}
.dmark.is-doing{border-color:var(--info);color:var(--info)}
.dmark.is-cancel{opacity:.5}
.btn.tiny{font-size:11.5px;min-height:29px;padding:3px 9px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center}

/* ── perguntas e propostas ── */
.ask-opts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.ask-free{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.ask-free .rin{flex:1;min-width:min(220px,100%);margin:0}

/* ── dropdown de filtro ── */
.dd{position:relative;display:inline-block;flex:none}
.dd-btn{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border:1px solid var(--line);
  border-radius:999px;background:var(--panel);color:var(--ink);font-family:inherit;font-size:14px;font-weight:600;line-height:1;cursor:pointer;
  transition:border-color .12s ease,color .12s ease}
.dd-btn:hover{border-color:var(--accent);color:var(--accent)}
.dd.open .dd-btn{border-color:var(--accent);color:var(--accent)}
.dd-chev{width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;
  transform:rotate(45deg) translateY(-1px);transition:transform .15s ease;flex:none}
.dd.open .dd-chev{transform:rotate(225deg) translateY(-.5px)}
.dd-pop{display:none;position:absolute;top:calc(100% + 7px);left:0;z-index:50;min-width:max(100%, 230px);max-height:320px;overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px}
.dd.open .dd-pop{display:block;animation:ddin .12s ease}
@keyframes ddin{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.dd-opt{padding:10px 14px;border-radius:9px;font-size:14px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.dd-opt:hover,.dd-opt.hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.dd-opt.on{color:var(--accent);font-weight:650}
.dd-opt.on:before{content:"\2713  ";font-weight:700}
.filters .chk input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}

/* ── barra de teclas (rodapé, como a TUI) ── */
.kbd-bar{position:fixed;left:var(--side);right:0;bottom:0;z-index:60;display:flex;gap:10px;align-items:center;
  padding:7px 16px;background:var(--panel);border-top:1px solid var(--line)}
.kctx{display:flex;gap:2px;flex-wrap:wrap;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.kctx::-webkit-scrollbar{display:none}
.kglobal{display:flex;gap:2px;margin-left:auto;flex:none}
.kkey{border:0;background:transparent;color:var(--ink);font-family:inherit;font-size:12.5px;font-weight:500;line-height:1;padding:6px 8px;border-radius:7px;cursor:pointer;white-space:nowrap}
.kkey:hover{background:var(--chip)}
.kkey kbd{font:11.5px ui-monospace,monospace;background:var(--chip);color:var(--accent);border-radius:5px;padding:2px 6px;margin-right:6px}
.kkey.dim{opacity:.4}
.kkey.gate kbd{background:var(--warnbg);color:var(--warn)}
.kbd-bar .knone{color:var(--muted);font-size:12.5px;padding:6px 2px}

/* ── filtro de lista em cascata ── */
.flt-off{display:none !important}
.lfbar{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:0 0 14px;padding:8px 12px;
  background:var(--warnbg);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:10px;font-size:14px}
.lflab{font-weight:700;color:var(--warn);white-space:nowrap}
.lfchip{display:inline-flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px}
.lfchip button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0 5px;border-radius:50%;min-width:24px;min-height:24px;display:inline-flex;align-items:center;justify-content:center}
.lfchip button:hover{color:var(--risk);background:var(--chip)}
.lfsep{color:var(--muted)}
.lfbar input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--accent);border-radius:8px;padding:3px 9px;min-width:min(190px,100%);outline:0}
.lfcount{margin-left:auto;font-weight:600;color:var(--ink);white-space:nowrap}
.lfcount.none{color:var(--risk)}
.lfhint{color:var(--muted);font-size:12.5px;white-space:nowrap}
.kkey.lfon kbd{background:var(--warnbg);color:var(--warn)}

/* ── teclado (mesmas teclas da TUI) ── */
.kbd-sel{outline:2px solid var(--accent);outline-offset:1px}
/* #97: um só idioma de foco no painel — :focus-visible usa o mesmo anel accent do j/k (.kbd-sel);
   campos de formulário mantêm o contorno suave próprio (.fld input:focus, especificidade maior) */
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.khelp td,.khelp th{padding:4px 10px}
.khelp td:first-child{font:12.5px ui-monospace,monospace;color:var(--accent);white-space:nowrap}
.khelp .grp td{border-top:1px solid var(--line);padding-top:8px;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.frow{display:grid;grid-template-columns:120px 1fr;gap:8px 10px;align-items:center;margin-bottom:8px}
.frow label{font-size:12.5px;color:var(--muted)}
.frow input,.frow select,.frow textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;font-size:14px;width:100%;min-width:0}
.frow textarea{resize:vertical;min-height:88px;line-height:1.45;font-family:inherit}
.gatebadge{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--warnbg);color:var(--warn);font-size:11.5px;font-weight:700}
#burger{display:none;position:fixed;top:10px;left:10px;z-index:70}
#burger.open{color:var(--accent);border-color:var(--accent)}

/* botões rápidos (só com ponte ligada) */
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:4px 10px;font:inherit;
  font-size:12.5px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{border-style:dashed;color:var(--muted)}

/* ── arrastar e soltar ── */
.card[draggable]{cursor:grab;-webkit-user-select:none;user-select:none}
.card[draggable]:active{cursor:grabbing}
.card.dragging{opacity:.4;transform:scale(.985) rotate(-.4deg)}
.col.drop-hint{outline:2px dashed var(--accent);outline-offset:-4px;
  background:color-mix(in srgb,var(--accent) 7%,var(--chip))}
.col.drop-hint::after{content:"soltar aqui";display:block;text-align:center;font-size:11.5px;font-weight:700;
  color:var(--accent);padding:6px 0 2px;letter-spacing:.04em}
.card.just-moved{animation:justmoved 1.2s ease}
@keyframes justmoved{0%{box-shadow:0 0 0 3px var(--accent);transform:translateY(2px)}100%{box-shadow:var(--shadow);transform:none}}

/* ── filtros ── */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 16px;align-items:center}
select{padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:14px}
label.chk{color:var(--muted);font-size:14px;display:inline-flex;gap:6px;align-items:center}

/* ── linha do tempo ── */
.tl{position:relative;margin-left:8px;border-left:2px solid var(--line);padding-left:16px}
.tl .it{position:relative;padding:5px 0}
.tl .it:before{content:"";position:absolute;left:-22px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.tl .k-decisão:before{background:var(--dsug)}.tl .k-entrega:before,.tl .k-entregável:before{background:var(--ok)}
.tl .k-reunião:before{background:var(--info)}.tl .k-ação\ fechada:before{background:var(--muted)}
.tl .k-plano:before{background:var(--warn)}

/* ── foco ── */
.week{display:grid;gap:8px;margin-top:6px;align-items:end;overflow-x:auto;max-width:100%;padding-bottom:4px} /* eixo e colunas alinham por baixo: slots de 400px coincidem */
.hcol{padding-bottom:8px}                                   /* compensa o padding inferior do .wday */
.wday{background:var(--chip);border-radius:10px;padding:8px}
.wday h2, .wday h3{margin:2px 4px 8px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis} /* 1 linha sempre: cabeçalho de altura única entre colunas */
.wslot{position:relative;height:400px;background:var(--panel);border-radius:9px;border:1px solid var(--line)}
.blk{position:absolute;left:5px;right:5px;border-radius:7px;background:var(--infobg);border-left:3px solid var(--info);padding:3px 8px;font-size:11.5px;line-height:1.3;overflow:hidden}
.blk.prop{border-left-style:dashed;opacity:.9}
.blk.busy{background:var(--chip);border-left:3px solid var(--muted);color:var(--muted);font-size:10.5px;z-index:1}
.blk:not(.busy){z-index:2}
.blk.conflict{outline:2px solid var(--risk);outline-offset:1px;background:var(--riskbg);border-left-color:var(--risk)}
.blk.tiny{min-height:18px;padding:1px 7px;font-size:10.5px;line-height:16px;white-space:nowrap;text-overflow:ellipsis}
.blk.reservable{cursor:pointer}
.blk.reservable:hover{outline:2px solid var(--accent);outline-offset:1px;filter:brightness(1.04)}
.planbtns{display:flex;gap:8px;align-items:center}
.hourmark{position:absolute;right:5px;transform:translateY(-50%);font-size:10.5px;color:var(--muted);opacity:.75;pointer-events:none;z-index:0}
.week .hcol .wslot{border-right:1px solid var(--line);border-radius:0 9px 9px 0;border-left:none}

/* ── outros ── */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg text{fill:var(--muted);font-size:11.5px}
.msg{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:12px;margin:8px 0 0;font-size:14px}
.msgrow header{font-size:14px}
.funnelchips{display:flex;gap:6px;flex-wrap:wrap}
.note{margin-top:14px}
.empty{color:var(--muted);padding:10px 14px;border:1px dashed var(--line);border-radius:9px;font-size:14px}
details summary{cursor:pointer}details summary:hover{color:var(--accent)}

/* ── ⌘K paleta ── */
.pal-back{position:fixed;inset:0;background:var(--backdrop);z-index:90;display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 16px}
.pal-back.open{display:flex}
.palette{width:640px;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden}
.palette .pin{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.palette .pin input{flex:1;border:0;background:transparent;color:var(--ink);font:16px/1.4 inherit;outline:0;min-width:0}
.palette .pin .hint{font:11.5px ui-monospace,monospace;color:var(--muted)}
.pal-list{max-height:46vh;overflow-y:auto;padding:6px}
.pal-group{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:8px 10px 4px}
.pal-item{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:14px}
.pal-item .ent{font:11.5px ui-monospace,monospace;color:var(--muted)}
.pal-item.sel,.pal-item:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.pal-item .cmd{font:12.5px ui-monospace,monospace;color:var(--accent);margin-left:auto;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-item.off{opacity:.55}
.pal-empty{padding:18px;text-align:center;color:var(--muted);font-size:14px}
.pal-confirm{border-top:1px solid var(--line);padding:12px 14px;background:var(--bg);display:none}
.pal-confirm.open{display:block}
.pal-confirm .cline{font:12.5px ui-monospace,monospace;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:10px;overflow-x:auto;white-space:nowrap}
.pal-confirm .row{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.pal-confirm .note-s{font-size:11.5px;color:var(--muted);margin-right:auto}

/* ── console da ponte ── */
.console{position:fixed;top:0;right:0;bottom:0;left:auto;z-index:80;background:var(--panel);border-left:1px solid var(--line);
  box-shadow:var(--console-shadow);transform:translateX(100%);transition:transform .18s ease;width:min(420px,92vw);display:flex;flex-direction:column}
.console.open{transform:translateX(0)}
.console header{display:flex;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:650}
.console header .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.console header .x{margin-left:auto;cursor:pointer;color:var(--muted);border:0;background:none;font-size:16px;min-width:24px;min-height:24px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px}
.console pre{margin:0;padding:10px 16px;overflow-y:auto;flex:1;min-height:0;font:12.5px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;scrollbar-width:thin}
.toprow{display:flex;justify-content:flex-end;align-items:center;padding:10px 14px 0;gap:10px}
.clidot{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);
  border-radius:999px;padding:5px 11px;cursor:pointer;font:600 12.5px/1 inherit;color:var(--muted);position:relative;z-index:90;
}
body.con-open .clidot{display:none}
.clidot .cdot{width:9px;height:9px;border-radius:50%;background:var(--risk);transition:background .15s}
.clidot.live .cdot{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent)}
.clidot.live{color:var(--ink)}
.clidot .conbadge{position:absolute;top:-6px;right:-6px;background:var(--accent);color:var(--accent-ink);border-radius:9px;
  font-size:10.5px;font-weight:700;line-height:1;padding:2px 6px;display:none}
.clidot .conbadge.on{display:inline-block}
.console .ok{color:var(--ok)}.console .err{color:var(--risk)}.console .dim{color:var(--muted)}

/* toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,80px);background:var(--ink);color:var(--bg);
  padding:9px 16px;border-radius:10px;font-size:14px;z-index:95;opacity:0;transition:all .2s ease;box-shadow:var(--shadow-lg)}
.toast.show{transform:translate(-50%,0);opacity:1}

@media (max-width:900px){
  .toprow{justify-content:space-between}
  .shell{grid-template-columns:1fr}
  aside.side{position:fixed;left:-260px;width:240px;z-index:60;transition:left .2s ease;box-shadow:var(--shadow-lg)}
  aside.side.open{left:0}
  .kanban{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}
  main.col{padding:16px 14px 120px}
  .kbd-bar{left:0;flex-wrap:wrap;gap:4px 8px}
  #burger{display:inline-flex}
}
@media (max-width:640px){
  .bd-tag{padding-right:7px}
  .bd-tag-m{max-width:100%}
  .kanban{grid-template-columns:minmax(0,1fr)}
  .mx{grid-template-columns:minmax(0,1fr)}
}


/* versão + atualização — rodapé da barra lateral */
.sb-status{display:flex;flex-direction:column;gap:4px;padding:2px 6px 6px}
.sb-stat-row{display:flex;align-items:center;gap:6px;width:100%;min-height:26px;padding:5px 8px;
  border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--muted);
  font-size:11.5px;text-align:left;cursor:pointer;line-height:1.3}
.sb-stat-row:hover{border-color:var(--accent);color:var(--ink)}
.sb-stat-row[hidden]{display:none}
.verbadge{font-weight:500}
.verbadge.behind{border-color:var(--accent);color:var(--accent);font-weight:600}
.verbadge.behind::before{content:"⚡";font-weight:700}
#newsback .palette{max-width:520px}
.news-meta{margin:0;padding:8px 14px 4px;font-size:12.5px;color:var(--muted)}
.news-meta:empty{display:none}
#newslist{overflow:auto;padding:4px 14px}
#newslist .ni{padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.45}
#newslist .ni:last-child{border-bottom:none}
#newslist .nv{color:var(--accent);font-weight:700;margin-right:6px}
.news-log{margin:6px 14px 4px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:220px;overflow-y:auto;
  white-space:pre-wrap;word-break:break-word}
.news-log[hidden]{display:none}
.news-log-line.ok{color:var(--ok)}
.news-log-line.err{color:var(--risk)}
.news-log-line.dim{color:var(--muted)}
.news-fb{font-size:12.5px;color:var(--ok)}
html[data-live="1"] .only-portrait,html:not([data-live="1"]) .only-live{display:none}

/* ── metodologia ICE (rubric): overlay empilhável + tabela larga ────────── */
.pal-scroll{max-height:70vh;overflow:auto;padding:12px 16px 16px}
.pal-scroll h3{margin:14px 0 6px;font-size:14px}
.icerub{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
.icerub th,.icerub td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
.icerub th{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--panel)}
.icerub td:first-child{font:700 12.5px ui-monospace,monospace;color:var(--accent);white-space:nowrap;width:34px}
.icerub td:nth-child(3){white-space:nowrap;width:110px}
.fhint{white-space:pre-line;line-height:1.4}
.fsug{margin:-4px 0 8px 130px;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  box-shadow:var(--shadow-lg);max-height:220px;overflow-y:auto;padding:4px}
.fsug[hidden]{display:none}
.fsug-item{display:flex;gap:10px;align-items:center;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:14px}
.fsug-item .ent{font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent);font-weight:600;white-space:nowrap}
.fsug-item.sel,.fsug-item:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.cline.miss{border-color:var(--risk);color:var(--risk)}
.frow .req{color:var(--risk);font-weight:700}

/* face Configurações: os passos da configuração guiada (Visão geral + uma aba por passo) */
.pagehead .kicker{margin:0 0 2px;color:var(--accent);font-size:12.5px;font-weight:600}
#setup [hidden]{display:none!important}
.stbar{height:5px;border-radius:5px;background:var(--line2);margin:0 0 14px;overflow:hidden;max-width:640px}
.stbar>span{display:block;height:100%;background:var(--accent);border-radius:5px}
.stlist{padding:4px 0;max-width:640px}
.strow{display:flex;align-items:center;gap:12px;padding:11px 18px;color:var(--ink);border-top:1px solid var(--line2)}
.strow:first-child{border-top:0}
.strow:hover{text-decoration:none;background:color-mix(in srgb,var(--accent) 6%,transparent)}
.strow .chip,.strow .stlater{min-width:44px;justify-content:center}
.strow .muted{margin-left:auto;font-size:12.5px;text-align:right}
.stgo{color:var(--muted)}
.stlater{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--line2);color:var(--muted)}
.stactions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.stactions .stmsg{margin-right:auto}
.stmsg{font-size:12.5px}.stmsg.ok{color:var(--ok)}.stmsg.late{color:var(--risk)}
.stsec{max-width:760px;margin-bottom:14px}
.sthead{display:flex;align-items:center;gap:10px;justify-content:space-between}
.sthead h2{margin:0 0 10px}
.stgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 16px}
.fld{display:flex;flex-direction:column;gap:5px;margin:0 0 12px;font-size:14px;color:var(--muted)}
.fld span{font-weight:600;color:var(--ink)}
.fld small{font-size:11.5px}
.fld input,.fld textarea,.fld select{padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.fld textarea{min-height:76px;resize:vertical}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:2px solid color-mix(in srgb,var(--accent) 40%,transparent);border-color:var(--accent)}
.stprof summary{cursor:pointer;color:var(--accent);font-size:14px;margin-bottom:8px}
.stsec pre,.stlog{white-space:pre-wrap;font:12.5px/1.5 ui-monospace,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;max-height:280px;overflow:auto;margin:0 0 10px}
.stconn{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line2)}
.stconn>div{display:flex;flex-direction:column;gap:2px;margin-right:auto}
.stopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:12px}
.stopt{display:flex;flex-direction:column;gap:6px;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.stopt span{font-size:12.5px;color:var(--muted)}
.stopt:hover{border-color:var(--accent)}
.stopt.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}

/* ── arrastar arquivo ou pasta para a inbox ── */
.inbox-drop-ov{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;gap:14px;padding:24px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.inbox-drop-ov[hidden]{display:none}
.pal-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line)}
.duprow{display:flex;gap:10px;align-items:baseline;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:12.5px}
.duprow:hover{background:color-mix(in srgb,var(--accent) 8%,var(--panel))}
.duprow input{accent-color:var(--accent)}
.duppath{font:11.5px ui-monospace,monospace;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.dupmeta{font-size:10.5px;color:var(--muted);white-space:nowrap}
.inbox-drop-zone{flex:1;display:flex;align-items:center;justify-content:center;border:2px dashed var(--line);
  border-radius:18px;background:color-mix(in srgb,var(--panel) 88%,transparent);
  transition:border-color .12s ease,background .12s ease,transform .12s ease;pointer-events:none}
.inbox-drop-zone.active{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel));
  transform:scale(1.005);box-shadow:var(--shadow-lg)}
.inbox-drop-card{text-align:center;padding:20px 28px;max-width:460px;pointer-events:none}
.inbox-drop-card strong{display:block;font-size:20px;font-weight:700;color:var(--ink);margin-bottom:4px}
.inbox-drop-zone.active .inbox-drop-card strong{color:var(--accent)}
.inbox-drop-card span{display:block;font-size:14px;color:var(--muted)}
.inbox-drop-offline{margin:auto;max-width:520px;padding:24px 28px;border-radius:16px;border:2px dashed var(--warn);
  background:var(--panel);color:var(--ink);text-align:center;box-shadow:var(--shadow-lg);pointer-events:none}
.inbox-drop-offline strong{display:block;font-size:16px;margin-bottom:6px;color:var(--warn)}
.inbox-drop-offline span{display:block;font-size:14px;color:var(--muted)}

/* ── #54 chip motivo do goal ── */
.chip.h-reason{background:var(--chip);color:var(--ink);border:1px solid var(--line);text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;margin-left:6px}
.chip.h-reason:hover{border-color:var(--accent);color:var(--accent);text-decoration:none}
/* #95: tela estreita — o chip de motivo ganha linha própria no cabeçalho do goal e clampa em 2 linhas
   (scrollHeight == clientHeight: o texto inteiro cabe; antes ~56% ficava no ellipsis) */
@media (max-width:600px){
  h2.sec{flex-wrap:wrap}
  .chip.h-reason{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;line-height:1.35}
}
.projcard.just-moved{animation:justmoved 1.2s ease}

/* ── frescor (pílula no rodapé + faixa na home) e cartão 'Seu dia' (#57w2 #60w2) ── */
.freshbadge{font-weight:600}
.freshbadge.fresh-ok{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:var(--okbg);color:var(--ok)}
.freshbadge.fresh-ok::before{content:"●";font-size:10.5px}
.freshbadge.fresh-warn{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));background:var(--warnbg);color:var(--warn)}
.freshbadge.fresh-warn::before{content:"⚠";font-size:11.5px}
.fresh-banner{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;
  margin:0 0 14px;padding:12px 14px;border-radius:var(--r);
  border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));border-left:3px solid var(--warn);
  background:color-mix(in srgb,var(--warnbg) 70%,var(--panel));color:var(--ink);box-shadow:var(--shadow)}
.fresh-banner-text{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 260px;font-size:14px}
.fresh-banner-text strong{color:var(--warn);font-weight:650}
.fresh-banner-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.brief-card{padding:14px 16px;margin:0 0 14px}
.brief-card:hover{transform:none;box-shadow:var(--shadow)}
.brief-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 8px}
.brief-head h2{margin:0;font-size:16px}
/* ── Seu dia: corpo em Markdown mínimo (#160) ─────────────────────────────
   Estrutura sobre texto já escapado pelo renderizador; cores só por token do tema. */
.brief-body{font-size:14px;line-height:1.5;color:var(--ink)}
.brief-body p{margin:0 0 8px;text-wrap:balance}
.brief-body>:last-child{margin-bottom:0}
.brief-body>:first-child{margin-top:0}
.bd-h{margin:14px 0 4px;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.bd-h4{margin:10px 0 2px;font-size:14px;font-weight:600}
.bd-h .bd-code,.bd-h .idchip,.bd-h .bd-tag{text-transform:none;letter-spacing:0}
.bd-ul,.bd-ol{margin:0 0 8px;padding:0;list-style:none}
.bd-li{position:relative;padding:1px 0 1px 16px;text-wrap:pretty}
.bd-li::before{content:"";position:absolute;left:4px;top:.72em;width:5px;height:5px;border-radius:50%;background:color-mix(in srgb,var(--muted) 45%,transparent)}
.bd-ol{counter-reset:bd}
.bd-ol>.bd-li::before{content:counter(bd);counter-increment:bd;left:0;top:.1em;width:auto;height:auto;background:none;color:var(--muted);font-size:12.5px;font-weight:600}
.bd-sub{margin:2px 0 2px}
.bd-quote{margin:6px 0 8px;padding:2px 0 2px 12px;border-left:3px solid var(--line);color:var(--muted)}
.bd-hr{border:0;border-top:1px solid var(--line);margin:10px 0}
/* chip de id dentro do brief: um pouco menos de respiro lateral, para a pontuação da frase não parecer solta */
.brief-body .idchip{padding-left:5px;padding-right:5px}
.bd-code{font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--chip);color:var(--muted);padding:1px 6px;border-radius:6px;overflow-wrap:anywhere;margin:0 1px}
.bd-nb{white-space:nowrap}
a.bd-id{display:inline-flex;align-items:center;min-height:24px;vertical-align:middle}
/* entidade citada: etiqueta = id + título + situação lidos do modelo */
.bd-tag{display:inline-flex;align-items:center;gap:6px;max-width:100%;min-height:24px;margin:4px 2px 4px 0;padding:1px 8px 1px 3px;
  border:1px solid color-mix(in srgb,var(--ink) 16%,transparent);border-radius:8px;font-size:12.5px;line-height:1.4;color:var(--ink);vertical-align:middle}
a.bd-tag:hover{border-color:var(--accent);text-decoration:none}
.bd-tag-t{min-width:0;max-width:36ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* situação = o chip de estado do painel (h-em-risco · h-atencao · h-info …): delimita o fim do título em vez de só mudar a cor da letra */
.bd-tag .bd-tag-s{line-height:1.25;padding:1px 7px;vertical-align:0}
.bd-tag>*{flex:none}
.bd-tag .bd-tag-t{flex:0 1 auto}
.bd-tag.is-done{color:var(--muted)}
.bd-tag.is-late .idchip{background:var(--riskbg);color:var(--risk)}
.bd-tag.is-soon .idchip,.bd-tag.is-prop .idchip,.bd-tag.is-block .idchip{background:var(--warnbg);color:var(--warn)}
.bd-tag.is-ask .idchip{background:var(--infobg);color:var(--info)}
/* várias entidades no mesmo item: duas por linha — chip e situação nunca encolhem, o título cede com reticências */
.bd-tag-m{max-width:calc(50% - 6px)}
.bd-tag-m .bd-tag-t{max-width:340px}
/* brief recolhido: além de 3 seções mostra as primeiras e um controle para abrir tudo.
   Sem gradiente: o corte cai no espaço em branco entre a última seção visível e o rótulo da seguinte (bdFitClamp). */
.brief-body.is-clamped{max-height:340px;overflow:hidden}
.brief-body.is-open{max-height:none}
.bd-more{display:inline-flex;align-items:center;gap:6px;min-height:32px;margin:4px 0 0;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--accent);
  font:600 12.5px/1 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;cursor:pointer}
.bd-more:hover{border-color:var(--accent)}
.bd-more-n{color:var(--muted);font-weight:500}
/* lado direito do cabeçalho: atalho dos avisos de saúde (sem ocupar linha) + "atualizado HH:MM" */
.brief-when{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;white-space:nowrap}
a.bd-hl{display:inline-flex;align-items:center;min-height:24px;font-weight:600;color:var(--warn)}
a.bd-hl:hover{color:var(--accent);text-decoration:underline}
.brief-quiet{margin:0;font-size:14px;color:var(--muted)}
.brief-card.is-quiet .brief-head{margin-bottom:4px}

/* wizard de configuração — modo primeira vez (F8), escopado em .obw/.obnav */
/* ── wizard de configuração (modo primeira vez do painel — F8) ─────────────────
   Portado do onboarding.html (que segue existindo como rollback da rota /onboarding).
   Tudo escopado em .obw (conteúdo) e .obnav (passos na barra lateral do painel):
   os tokens (:root) vêm do dashboard.css — identidade única, ruling 2026-11-18. */

/* passos na barra lateral do painel (substituem faces+abas no modo primeira vez) */
body.obmode #faces, body.obmode #tabs, body.obmode #openpal { display: none; }
/* altura natural: nunca recorta passo no meio — quem rola, se precisar, é a própria
   barra lateral (aside.side já é overflow-y:auto). flex 1 0 auto = ocupa o que sobra,
   mas não encolhe abaixo do conteúdo. */
.obnav { flex: 1 0 auto; display: flex; flex-direction: column; }
.obnav .grp { font: 700 10.5px/1 system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); margin: 12px 8px 4px; }
.obnav .steps { list-style: none; margin: 0; padding: 0; }
.obnav .steps li { display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: 9px;
  color: var(--muted); cursor: pointer; font-size: 13px; font-weight: 500; transition: .12s; }
.obnav .steps li:hover { background: var(--line2); color: var(--ink); }
.obnav .steps li.cur { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); font-weight: 650; }
.obnav .steps li.done { color: var(--ink); }
.obnav .steps .dot { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line);
  display: grid; place-items: center; font-size: 10px; font-weight: 700; flex: none; color: var(--muted); background: var(--panel); }
.obnav .steps li.done .dot { background: var(--okbg); border-color: color-mix(in srgb, var(--ok) 45%, transparent); color: var(--ok); }
.obnav .steps li.cur .dot { border-color: var(--accent); color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent); }
.obnav .obnote { font-size: 11.5px; color: var(--muted); margin: 10px 6px 0; line-height: 1.45; }

/* conteúdo do wizard: barra de progresso + tela */
.obw { max-width: 860px; margin: 0 auto; padding: 8px 0 60px; }
.obw .bar { height: 3px; background: var(--line); position: sticky; top: 0; z-index: 20; margin: 0 -8px; }
.obw .bar i { display: block; height: 100%; background: var(--accent); transition: width .3s ease; }
.obw .obcontent { padding: 26px 32px 0; }

/* tipografia das telas */
.obw .kicker { color: var(--accent); font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; font-weight: 700; }
.obw h1 { font-size: 24px; line-height: 1.25; margin: 6px 0 8px; letter-spacing: -.015em; }
.obw h2 { font-size: 15.5px; margin: 0 0 6px; font-weight: 650; }
.obw h3 { font-size: 14px; margin: 0 0 4px; font-weight: 650; }
.obw .lead { color: var(--muted); font-size: 14.5px; margin: 0 0 22px; max-width: 66ch; }

/* cards */
.obw .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
  padding: 18px 20px; margin: 0 0 14px; box-shadow: var(--shadow); }
.obw .card.soft { background: var(--chip); box-shadow: none; }
.obw .sub { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.obw .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.obw .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

/* formulários */
.obw label.f { display: block; margin-bottom: 14px; }
.obw label.f > span { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 5px; color: var(--ink); }
.obw label.f > small { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; }
.obw input[type=text], .obw input[type=email], .obw input[type=password], .obw input[type=time],
.obw input[type=date], .obw select, .obw textarea {
  width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--ink); border-radius: 8px;
  padding: 9px 11px; font: inherit; font-size: 13.5px; outline: none; transition: border-color .15s; }
.obw textarea { min-height: 100px; resize: vertical; }
.obw input:focus, .obw select:focus, .obw textarea:focus { border-color: var(--accent); }
.obw input::placeholder, .obw textarea::placeholder { color: var(--muted); opacity: .75; }
/* Campo e seletor são a mesma caixa. `<select>` com appearance:auto entrega o desenho ao tema nativo
   (no macOS, um botão de altura própria dentro da caixa) e o UA stylesheet força line-height:normal
   nele — ficava 2px mais baixo que o campo ao lado. Desenho nosso: altura única, seta em var(--muted)
   (acompanha o tema) e rótulo longo termina em reticências em vez de cortar no meio da letra. */
.obw input[type=text], .obw input[type=email], .obw input[type=password], .obw input[type=time],
.obw input[type=date], .obw select { height: 40px; }
.obw select {
  appearance: none; -webkit-appearance: none; line-height: 1.5;
  padding-right: 30px; text-overflow: ellipsis;
  background-image: linear-gradient(45deg, transparent 40%, var(--muted) 40%, var(--muted) 60%, transparent 60%),
                    linear-gradient(135deg, transparent 40%, var(--muted) 40%, var(--muted) 60%, transparent 60%);
  background-position: right 16px center, right 10px center;
  background-size: 6px 6px; background-repeat: no-repeat;
}
.obw .req { color: var(--warn); }
.obw .kbd { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--chip);
  color: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; white-space: nowrap; }

/* botões & barra inferior */
.obw .actions { display: flex; gap: 10px; align-items: center; margin-top: 22px; flex-wrap: wrap; }
.obw .btn { appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  padding: 9px 16px; border-radius: 9px; font: 600 13.5px/1.2 inherit; cursor: pointer; transition: .12s;
  display: inline-flex; align-items: center; gap: 8px; }
.obw .btn:hover { border-color: var(--accent); color: var(--accent); }
.obw .btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.obw .btn.pri:hover { filter: brightness(1.06); color: var(--accent-ink); }
.obw .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.obw .btn.ghost:hover { color: var(--ink); background: var(--line2); border-color: transparent; }
.obw .btn:disabled { opacity: .5; cursor: not-allowed; filter: none; }
.obw .btn.sm { padding: 6px 12px; font-size: 12.5px; border-radius: 8px; }
.obw .spacer { flex: 1; }

/* pills */
.obw .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600;
  padding: 3px 9px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.obw .pill.ok { background: var(--okbg); color: var(--ok); }
.obw .pill.warn { background: var(--warnbg); color: var(--warn); }
.obw .pill.bad { background: var(--riskbg); color: var(--risk); }
.obw .pill.info { background: var(--infobg); color: var(--info); }
.obw .pill.off, .obw .pill.muted { background: var(--chip); color: var(--muted); }
.obw .pill.rec { background: color-mix(in srgb, var(--dsug) 13%, transparent); color: var(--dsug); }

/* alertas & logs */
.obw .msg { border-radius: 9px; padding: 10px 13px; font-size: 13.5px; margin: 12px 0 0; display: none; }
.obw .msg.show { display: block; }
.obw .msg.err { background: var(--riskbg); border: 1px solid color-mix(in srgb, var(--risk) 35%, transparent); color: var(--risk); }
.obw .msg.ok { background: var(--okbg); border: 1px solid color-mix(in srgb, var(--ok) 35%, transparent); color: var(--ok); }
.obw .msg.info { background: var(--infobg); border: 1px solid color-mix(in srgb, var(--info) 35%, transparent); color: var(--info); }
.obw .msg.warn { background: var(--warnbg); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); color: var(--warn); }
.obw .log { background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 11px 13px;
  font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink); max-height: 220px;
  overflow: auto; white-space: pre-wrap; margin-top: 12px; display: none; }
.obw .log.show { display: block; }
.obw .spin { width: 13px; height: 13px; border: 2px solid color-mix(in srgb, currentColor 28%, transparent);
  border-top-color: currentColor; border-radius: 50%; animation: obwsp .8s linear infinite; display: inline-block; }
@keyframes obwsp { to { transform: rotate(360deg); } }

/* conectores, toggles, fontes */
.obw .conn, .obw .rowline { display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 12px 0; border-top: 1px solid var(--line2); }
.obw .conn:first-of-type, .obw .rowline:first-of-type { border-top: none; }
.obw .conn .info, .obw .rowline .info { min-width: 0; flex: 1; }
.obw .conn b, .obw .rowline b { font-size: 14px; }
.obw .conn p, .obw .rowline .d { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.obw .conn .right, .obw .rowline .right { display: flex; align-items: center; gap: 10px; flex: none; }
.obw .toggle { position: relative; width: 38px; height: 22px; flex: none; display: inline-block; }
.obw .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
.obw .toggle span { position: absolute; inset: 0; background: var(--chip2); border-radius: 999px; cursor: pointer; transition: .18s; }
.obw .toggle span::after { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px;
  background: var(--panel); border-radius: 50%; box-shadow: 0 1px 2px rgba(0, 0, 0, .2); transition: .18s; }
.obw .toggle input:checked + span { background: var(--ok); }
.obw .toggle input:checked + span::after { transform: translateX(16px); }
.obw .toggle input:disabled + span { opacity: .45; cursor: not-allowed; }
.obw ol.howto { margin: 8px 0 0; padding-left: 20px; color: var(--muted); }
.obw ol.howto li { margin: 5px 0; }
.obw .twrap { overflow-x: auto; }
.obw table.src { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; }
.obw table.src th { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); font-size: 11px;
  text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
.obw table.src td { padding: 8px; border-bottom: 1px solid var(--line2); vertical-align: middle; }
.obw table.src td .d { color: var(--muted); font-size: 12.5px; }
.obw .addform { border: 1px dashed var(--line); border-radius: 10px; padding: 14px; margin-top: 12px; background: var(--bg); }
/* Tipo carrega os rótulos mais longos do registro ("drive-doc · doc, planilha ou slides"); Janela só
   "1d…auto". Sem a Janela (tipos relidos fora de janela), as duas colunas restantes ocupam a linha. */
.obw .addform .grid3 { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, .8fr); }
.obw .addform .grid3:has(> label.f:nth-child(3).hidden) { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); }

/* agentes */
.obw .agentcard { display: flex; align-items: center; gap: 12px; border: 1.5px solid var(--line); border-radius: var(--r);
  padding: 12px 14px; margin-bottom: 9px; cursor: pointer; background: var(--panel); transition: .12s; }
.obw .agentcard:hover { border-color: var(--accent); }
.obw .agentcard.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, var(--panel)); }
.obw .agentcard.dim { opacity: .58; cursor: default; }
.obw .agentcard.dim:hover { border-color: var(--line); }
.obw .agentcard .ai-ic { width: 34px; height: 34px; border-radius: 9px; flex: none; display: grid;
  place-items: center; background: var(--chip); font-size: 16px; font-weight: 700; color: var(--ink); }
.obw .agentcard .meta { min-width: 0; flex: 1; }
.obw .agentcard b { display: inline-block; font-size: 14px; margin-right: 6px; }
.obw .agentcard .d { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.obw .radio { width: 17px; height: 17px; border-radius: 50%; border: 2px solid var(--line); flex: none; }
.obw .agentcard.sel .radio { border-color: var(--accent); box-shadow: inset 0 0 0 3px var(--panel); background: var(--accent); }

/* memória: modos + slots */
.obw .opt { border: 1.5px solid var(--line); border-radius: var(--r); padding: 15px 16px; cursor: pointer;
  transition: .12s; background: var(--panel); display: flex; flex-direction: column; gap: 6px; }
.obw .opt:hover { border-color: var(--accent); }
.obw .opt.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, var(--panel)); }
.obw .opt h3 { margin: 2px 0 0; font-size: 15px; }
.obw .opt p { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
.obw .slot { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-top: 10px; background: var(--bg); }
.obw .slot .sh { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; font-weight: 650; }
.obw .egress { display: flex; gap: 8px; align-items: flex-start; background: var(--warnbg); color: var(--warn);
  border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); border-radius: 9px; padding: 9px 12px;
  font-size: 12.5px; margin-top: 12px; }
.obw .check { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; color: var(--muted);
  margin: 14px 0 0; cursor: pointer; }
.obw .check input { margin-top: 3px; accent-color: var(--accent); width: 16px; height: 16px; flex: none; }

/* perfil, upload, tree, welcome, conversa, resumo */
.obw .preview { background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 16px 20px;
  max-height: 420px; overflow: auto; }
.obw .preview h1 { font-size: 18px; margin: 0 0 6px; }
.obw .preview h2 { font-size: 14.5px; color: var(--accent); margin: 16px 0 6px; }
.obw .preview p { margin: 6px 0; color: var(--ink); }
.obw .preview em { color: var(--muted); }
.obw .drop { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 22px; text-align: center;
  color: var(--muted); transition: .12s; cursor: pointer; background: var(--bg); }
.obw .drop:hover, .obw .drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 5%, var(--bg)); }
.obw .drop b { color: var(--ink); }
.obw .files { list-style: none; padding: 0; margin: 10px 0 0; }
.obw .files li { display: flex; justify-content: space-between; padding: 7px 0; border-top: 1px solid var(--line2);
  font-size: 13px; color: var(--muted); }
.obw .tabs { display: inline-flex; background: var(--chip); border: 1px solid var(--line); border-radius: 10px;
  padding: 3px; margin-bottom: 16px; }
.obw .tabs button { border: none; background: none; color: var(--muted); padding: 7px 14px; border-radius: 8px;
  font: 600 13px inherit; cursor: pointer; }
.obw .tabs button.on { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.obw .tree .goal { border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin-bottom: 12px; background: var(--panel); }
.obw .tree .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.obw .tree .row input { flex: 1; }
.obw .tree .lvl { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; width: 84px; flex: none; }
.obw .tree .lvl.g { color: var(--accent); }
.obw .tree .lvl.p { color: var(--dsug); }
.obw .tree .lvl.d { color: var(--muted); }
.obw .tree .proj { margin: 10px 0 0 18px; padding-left: 14px; border-left: 2px solid color-mix(in srgb, var(--dsug) 35%, transparent); }
.obw .tree .del { margin-left: 18px; }
.obw .x { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1;
  padding: 2px 6px; border-radius: 6px; }
.obw .x:hover { color: var(--risk); background: var(--riskbg); }
.obw .add { background: none; border: none; color: var(--accent); cursor: pointer; font: 600 12.5px inherit; padding: 4px 0; }
.obw .hier { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0 4px; font-size: 12.5px; color: var(--muted); }
.obw .hier span { padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); }
.obw .hier span.g { color: var(--accent); font-weight: 600; }
.obw .hier span.p { color: var(--dsug); font-weight: 600; }
.obw .welcome { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 26px; align-items: center; }
.obw .app-tile { text-align: center; }
.obw .app-tile img { width: 148px; height: 148px; border-radius: 32px; box-shadow: var(--shadow-lg); display: block; margin: 0 auto; }
.obw .app-tile small { display: block; margin-top: 10px; color: var(--muted); font-size: 12px; }
.obw .feat { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 8px; }
.obw .feat div { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 13px 14px;
  font-size: 13px; color: var(--muted); box-shadow: var(--shadow); }
.obw .feat b { display: block; color: var(--ink); margin-bottom: 3px; font-size: 13.5px; }
.obw .msgline { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
  font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.obw .msgline.you { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); color: var(--ink); }
.obw .summary { list-style: none; margin: 0; padding: 0; }
.obw .summary li { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line2);
  font-size: 13.5px; flex-wrap: wrap; }
.obw .summary li:first-child { border-top: none; }
.obw .summary .extra { color: var(--muted); font-size: 13px; }
.obw .hidden { display: none !important; }

@media (max-width: 900px) {
  .obnav .steps { display: flex; overflow-x: auto; gap: 4px; padding-bottom: 2px; }
  .obnav .steps li { flex: none; padding: 6px 8px; }
  .obnav .steps li span.t { display: none; }
  .obnav .grp { display: none; }
  .obnav .obnote { display: none; }
  .obw .obcontent { padding: 18px 14px 0; }
  .obw .grid2, .obw .grid3, .obw .feat, .obw .welcome { grid-template-columns: 1fr; }
  .obw .addform .grid3, .obw .addform .grid3:has(> label.f:nth-child(3).hidden) { grid-template-columns: 1fr; }
  .obw .welcome img { width: 140px; height: 140px; margin: 0 auto; }
}
</style>
</head>
<body>

async function api(path, opts){
  const headers = Object.assign({"X-Brain-Token": TOK || ""}, (opts && opts.headers) || {});
  const r = await fetch(path, Object.assign({}, opts, {headers}));
  if (r.status === 401) { handle401(); throw new Error("401"); }
  return r.json();
}
async function serveRun(cmd, onResp){
  conOpen();
  conLine('<span class="dim">$</span> ' + esc(cmd));
  let j;
  try {
    j = await api("/api/cmd", {method: "POST", headers: {"Content-Type": "application/json"},
                              body: JSON.stringify({cmd: cmd})});
  } catch (e) { conLine('<span class="late">ponte fora do ar — ./brain serve</span>'); if (onResp) onResp(null); return false; }
  if (onResp) onResp(j);
  (j.out || []).forEach(l => conLine('<span class="' + (l.startsWith("✓") ? "ok" : "dim") + '">' + esc(l) + "</span>"));
  if (j.err) conLine('<span class="late">' + esc(j.err.split("\n")[0]) + "</span>");
  if (j.error) conLine('<span class="late">' + esc(j.error) + "</span>");
  if (!j.ok) { toast("comando recusado — saída no console"); return false; }
  try {
    const d = await api("/api/data");
    if (window.BRAIN && window.BRAIN.refresh) window.BRAIN.refresh(d.model);
  } catch (e) { /* views regeneram no próximo brain render */ }
  return true;
}

function colOf(a){ if (!a.open) return "fechada"; if (a.parked) return "depois"; return ((a.blocked_by && a.blocked_by.length) || a.status === "bloqueada" || a.status === "aguardando") ? "aguardando" : a.status; }
function dropPlan(a, target){                    // → {cmd, mut, dialog?, deny?}
  const from = colOf(a);
  if (from === target) return null;
  if (target === "fechada")
    return {dialog: () => closeForm(a)};          // como foi + resultado opcional (WIN)
  if (!a.open)
    return {dialog: () => reopenForm(a)};         // motivo, como a TUI pede
  if (target === "depois")                        // adiar de propósito: só o dono (ownerCmd põe --by owner); fazendo volta a "a fazer"
    return {cmd: "brain action update " + a.id + " --park" + (a.status === "fazendo" ? " --status aberta" : ""),
      mut: m => { const y = m.actions.find(y => y.id === a.id); y.parked = true; y.overdue_days = 0; if (y.status === "fazendo") y.status = "aberta"; }};
  const unpark = from === "depois" ? " --unpark" : "";
  if (a.blocked_by.length && target !== "aguardando")
    return {deny: a.id + " segue bloqueada por " + a.blocked_by.join(", ") + " — resolva o bloqueio para movê-la"};
  const st = target === "aguardando" ? "aguardando" : target;
  return {cmd: "brain action update " + a.id + unpark + (a.status !== st ? " --status " + st : ""),
    mut: m => { const y = m.actions.find(y => y.id === a.id); y.status = st; if (unpark) y.parked = false; }};
}

async function obApi(path, body){
  const o = {headers: {"X-Brain-Token": TOK || ""}};
  if (body !== undefined) { o.method = "POST"; o.headers["Content-Type"] = "application/json"; o.body = JSON.stringify(body); }
  const r = await fetch(path, o);
  if (r.status === 401) { handle401(); throw new Error("sessão expirada — reabra via ./brain render --open ou pelo app Brain"); }
  let j = {};
  try { j = await r.json(); } catch (e) {}
  if (!r.ok || j.ok === false) throw new Error(j.error || ("erro " + r.status));
  return j;
}
const obAct = (name, body) => obApi("/api/onboard/" + name, body || {});
async function obJob(id, onTick){
  const started = Date.now();
  for (;;) {
    const j = (await obApi("/api/onboard/job/" + id)).job;
    if (onTick) onTick(j);
    if (j.status === "stale") throw new Error((j.result && j.result.error) || "tempo esgotado (15 min) — rode `brain doctor --online` no terminal");
    if (j.status !== "running") return j;
    if (Date.now() - started >= OB_JOB_TIMEOUT_MS) throw new Error("tempo esgotado (15 min) — rode `brain doctor --online` no terminal");
    await new Promise(r => setTimeout(r, 1500));
  }
}

    '<div class="pal-confirm open" style="display:block;border-top:0;padding:14px 16px;max-height:70vh;overflow:auto">' +
    (sub ? '<p class="note-s" style="margin:0 0 10px">' + esc(sub) + "</p>" : "") + (opts.extra || "") + rows +
    '<div class="cline" data-preview style="min-height:34px;white-space:pre"></div>' +
    '<div class="dup-box" data-dup-box hidden style="margin:8px 0;padding:10px 12px;border:1px solid var(--warn, #b45309);border-radius:8px;background:rgba(180,83,9,.08)"></div>' +
    '<div class="note-s" data-err style="margin:0 0 6px;color:var(--risk)"></div>' +
    '<div class="row"><span class="note-s">mesma linha que a TUI roda · ' + (fm.fields.some(f => f.multi) ? "ctrl+enter" : "enter") + " confirma · esc cancela</span>" +
    (opts.help ? '<button class="btn ghost" data-help>? orientações</button>' : "") +
    '<button class="btn ghost" data-x>cancelar</button><button class="btn primary" data-ok>' + (fm.gate ? "aprovar" : fm.fields.length ? "executar" : "confirmar") + "</button></div></div></div>";
  document.body.appendChild(ov); dlgOpen = true;
  let h2 = null;
  const close = () => { ov.remove(); dlgOpen = false; if (h2) document.removeEventListener("keydown", h2, true); };
  const el = k => ov.querySelector('[data-k="' + k + '"]');
  const vals = () => { const v = {}; fm.fields.forEach(f => { const e = el(f.id); v[f.id] = e ? e.value : ""; }); return v; };
  const paint = () => {
    const v = vals(), hid = F.hidden(fm, v, ctx, M), w = F.values(fm, v, ctx, M);

      const h = ov.querySelector('[data-hint="' + f.id + '"]'); if (h) h.textContent = f.hint && w[f.id] ? F.hint(f.hint, w[f.id], w, ctx, M) : ""; });

  };
  const sugState = {};

    hd.style.marginBottom = "4px";
    hd.textContent = "Possível duplicata";

    const ul = document.createElement("ul");
    ul.style.margin = "4px 0 8px 18px";
    ul.style.padding = "0";
    cands.forEach(line => {
      const li = document.createElement("li");
      li.textContent = line;

    const btn = document.createElement("button");

    btn.className = "btn primary";
    btn.setAttribute("data-force-submit", "1");

      return;
    }

async function runAgent(action, arg, what, how){
  if (!LIVE) { agentToast(what, how, "ponte serve desligada"); return false; }
  if (!isAgentOk()) { agentToast(what, how, "runner não configurado"); return false; }
  conToggle(true);
  conLine('<span class="dim">⚡</span> ' + esc(how || ("/" + action + (arg ? " " + arg : ""))));
  let res;
  try {
    res = await api("/api/agent", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({action: action, arg: arg || ""}),
    });
  } catch (e) {
    conLine('<span class="late">ponte fora do ar — ./brain serve</span>');
    return false;
  }
  if (!res.ok) {
    const msg = res.error || "falha ao iniciar ação do agente";
    conLine('<span class="late">' + esc(msg) + "</span>");
    toast(msg);
    return false;
  }
  toast("⚡ " + what + " — executando…");
  let seen = 0, job = null;
  while (true) {
    await new Promise(r => setTimeout(r, 800));
    let jr;
    try {
      jr = await api("/api/agent/job/" + encodeURIComponent(res.id));
    } catch (e) {
      conLine('<span class="late">perdeu contato com a ponte durante a execução</span>');
      toast("perdeu contato com a ponte");
      return false;
    }
    if (!jr.ok || !jr.job) {
      conLine('<span class="late">execução do agente não encontrada</span>');
      return false;
    }
    job = jr.job;
    const lines = job.lines || [];
    for (; seen < lines.length; seen++) {
      const ln = lines[seen];
      conLine('<span class="' + (ln.startsWith("✓") ? "ok" : "dim") + '">' + esc(ln) + "</span>");
    }
    if (job.status !== "running") break;
  }
  const ok = job.status === "done" && job.rc === 0;
  if (ok) {
    conLine('<span class="ok">✓ ' + esc(what) + " concluído</span>");
    toast("✓ " + what + " concluído");
  } else {
    const errMsg = "✗ " + what + " falhou (código " + job.rc + ")";
    conLine('<span class="late">' + esc(errMsg) + "</span>");
    toast(errMsg);
  }
  try {
    const d = await api("/api/data");
    if (window.BRAIN && window.BRAIN.refresh) window.BRAIN.refresh(d.model);
  } catch (e) { /* views regeneram no próximo render */ }
  return ok;
}

window.addEventListener("keydown", e => {
  if (document.body.classList.contains("obmode")) return;   // wizard (F8): sem paleta na configuração
  if ((e.metaKey || e.ctrlKey) && !e.altKey && ((e.key && ["k", "p"].includes(e.key.toLowerCase())) || e.code === "KeyK")) {
    e.preventDefault(); e.stopPropagation(); pal.open ? closePal() : openPal();
  }
}, true);
document.addEventListener("keydown", e => {
  if (pal.open) {
    if (e.key === "Escape") closePal();
    if (e.key === "ArrowDown") { e.preventDefault(); pal.sel = Math.min(pal.items.length - 1, pal.sel + 1); renderPal(); }
    if (e.key === "ArrowUp") { e.preventDefault(); pal.sel = Math.max(0, pal.sel - 1); renderPal(); }
    if (e.key === "Enter") { e.preventDefault(); if ($("#palconfirm").classList.contains("open")) $("#palrun").click(); else pick(pal.sel); }
    return;
  }
  const openOv = document.querySelector(".pal-back.open");             // form/dialog aberto: só Esc fecha
  if (openOv) {
    if (e.key === "Escape") {
      if (openOv.id === "newsback") { openOv.classList.remove("open"); openOv.hidden = true; }
      else openOv.remove();
    }
    return;
  }
  if (document.querySelector(".dd.open")) return;                      // dropdown de filtro cuida de si
  if (/input|textarea|select/i.test(e.target.tagName || "") || e.target.isContentEditable) return;
  const k = e.key;
  if (k === "`") { e.preventDefault(); conToggle(); return; }
  if (k === "Tab") {                                            // carrossel: Tab avança, Shift+Tab volta, wrap nas pontas
    e.preventDefault();
    if (faceList.length > 1) {
      const i = Math.max(0, faceList.findIndex(f => f[0] === faceCur));
      const step = e.shiftKey ? faceList.length - 1 : 1;
      location.hash = "#face/" + faceList[(i + step) % faceList.length][0];
    }
    return;
  }
  if (k === "/") { e.preventDefault(); lfOpen(); return; }
  if (k === "g" || k === ":") { e.preventDefault(); openPal(); return; }      // busca/paleta: g e : (como a TUI)
  if (k === "Escape" && lfPop()) { e.preventDefault(); return; }
  if (k === "N") { e.preventDefault(); noteForm(); return; }                  // nota rápida em qualquer página
  if (k === "?") { e.preventDefault(); helpOverlay(); return; }
  if (k === "j" || k === "ArrowDown") { e.preventDefault(); selMove(1); return; }
  if (k === "k" || k === "ArrowUp") { e.preventDefault(); selMove(-1); return; }
  if (k === "Enter" && SEL.i >= 0) { e.preventDefault(); selOpen(); return; }
  if (["[", "ArrowLeft", "h", "]", "ArrowRight", "l"].includes(k)) {
    e.preventDefault(); navStep(["[", "ArrowLeft", "h"].includes(k) ? -1 : 1); return; }
  if (ctxKeys(k)) e.preventDefault();
});

// ── arrastar arquivo ou pasta para a inbox (ponte ./brain serve) ─────────
const INBOX_OFFLINE_MSG = "Ponte CLI inativa — rode ./brain serve para arrastar arquivos para o painel, ou salve direto em vault/RAW/inbox/.";
const INBOX_SKIP = new Set([".DS_Store", ".keep.md"]);
let inboxDragDepth = 0;

// Pasta de origem (File System Access API): o navegador não entrega o caminho de um arquivo
// arrastado. A ponte já procura o original no disco e apaga (byte a byte conferido); as pastas
// concedidas aqui são o COMPLEMENTO — cobrem pastas fora de HOME ou instâncias com a busca
// desligada ([serve].move_search = false). Várias pastas; lembradas no IndexedDB (porta fixa).
let inboxOrigins = null;                   // [{handle,name}] | null (ainda não carregado)
const INBOX_ORIGIN_DB = "brain-panel", INBOX_ORIGIN_STORE = "handles",
      INBOX_ORIGIN_KEY = "inbox-origins", INBOX_ORIGIN_LEGACY = "inbox-origin";
function inboxIdb(){
  return new Promise((res, rej) => {
    const q = indexedDB.open(INBOX_ORIGIN_DB, 1);
    q.onupgradeneeded = () => { q.result.createObjectStore(INBOX_ORIGIN_STORE); };
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
}
function inboxIdbGet(key){
  return new Promise(async (res, rej) => {
    try {
      const db = await inboxIdb();
      const rq = db.transaction(INBOX_ORIGIN_STORE, "readonly").objectStore(INBOX_ORIGIN_STORE).get(key);
      rq.onsuccess = () => res(rq.result || null);
      rq.onerror = () => rej(rq.error);
    } catch (e) { res(null); }
  });
}
function inboxIdbPut(key, val){
  return new Promise(async (res, rej) => {
    try {
      const db = await inboxIdb();
      const tx = db.transaction(INBOX_ORIGIN_STORE, "readwrite");
      if (val === null) tx.objectStore(INBOX_ORIGIN_STORE).delete(key);
      else tx.objectStore(INBOX_ORIGIN_STORE).put(val, key);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    } catch (e) { res(); }
  });
}
async function inboxOriginsLoad(){
  if (!("indexedDB" in window)) { inboxOrigins = []; return inboxOrigins; }
  let list = await inboxIdbGet(INBOX_ORIGIN_KEY);
  if (!list) {                                     // migração: chave única da 1ª versão
    const single = await inboxIdbGet(INBOX_ORIGIN_LEGACY);
    list = single && single.kind === "directory" ? [single] : [];
    if (list.length) { await inboxIdbPut(INBOX_ORIGIN_KEY, list); await inboxIdbPut(INBOX_ORIGIN_LEGACY, null); }
  }
  inboxOrigins = Array.isArray(list) ? list.filter(h => h && h.kind === "directory").map(h => ({handle: h, name: h.name})) : [];
  updateInboxDropHint();
  return inboxOrigins;
}
async function inboxOriginsSave(list){
  inboxOrigins = list.slice();
  await inboxIdbPut(INBOX_ORIGIN_KEY, list.map(o => o.handle));
  updateInboxDropHint();
}
async function inboxOriginsWritable(){
  // Chamada no instante do drop: requestPermission({mode:"readwrite"}) exige ativação de
  // usuário fresca — nunca depois dos envios, que podem demorar mais que a janela de ativação.
  if (!inboxOrigins) await inboxOriginsLoad();
  const out = [];
  for (const o of inboxOrigins) {
    try {
      if (await o.handle.queryPermission({mode: "readwrite"}) === "granted") { out.push(o.handle); continue; }
      if (await o.handle.requestPermission({mode: "readwrite"}) === "granted") out.push(o.handle);
    } catch (e) { /* sem ativação ou negado: fica para a busca da ponte */ }
  }
  return out;
}
async function inboxOriginRemove(handles, relPath, file){
  // Apaga APENAS sob nome+tamanho+horário+bytes idênticos ao que caiu — nunca por nome puro:
  // homônimo na pasta concedida com outro conteúdo é cópia mantida, não original apagado.
  for (const handle of handles) {
    try {
      const parts = relPath.split("/").filter(Boolean), name = parts.pop();
      if (!name) continue;
      let dir = handle;
      for (const seg of parts) dir = await dir.getDirectoryHandle(seg);
      const g = await (await dir.getFileHandle(name)).getFile();
      if (g.size !== file.size || g.lastModified !== file.lastModified) continue;
      const [aBuf, bBuf] = await Promise.all([file.arrayBuffer(), g.arrayBuffer()]);
      if (aBuf.byteLength !== bBuf.byteLength) continue;
      const aBytes = new Uint8Array(aBuf), bBytes = new Uint8Array(bBuf);
      let same = true;
      for (let i = 0; i < aBytes.length; i++) {
        if (aBytes[i] !== bBytes[i]) { same = false; break; }
      }
      if (!same) continue;
      await dir.removeEntry(name);
      return handle.name;
    } catch (e) { /* tenta a próxima pasta */ }
  }
  return null;
}
window.BRAIN_INBOX = { originRemove: inboxOriginRemove };
if (LIVE) inboxOriginsLoad();
