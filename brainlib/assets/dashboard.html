<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Segundo Cérebro</title>
<style>/* VARIANTE B — App lateral: sidebar fixa, ⌘K com ponte CLI (./brain serve). */
:root{
  --sug:#c2255c; --dsug:#7048e8;
  --bg:#f4f5f7; --panel:#ffffff; --ink:#191c22; --muted:#646e7c; --line:#e5e8ee; --line2:#eff1f5;
  --accent:#3b5bdb; --accent-ink:#fff;
  --ok:#2b8a3e; --okbg:#e7f6ec; --warn:#d9730d; --warnbg:#fdf0e0; --risk:#d6333d; --riskbg:#fcebec;
  --info:#1971c2; --infobg:#e7f1fb; --chip:#eef0f4; --chip2:#e3e6ec;
  --chart-a:#40c057; --chart-b:#91a7ff;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.07);
  --shadow-lg:0 12px 32px rgba(16,24,40,.18);
  --r:12px; --side:236px;
}
html[data-theme=dark]{
  --sug:#f06595; --dsug:#b197fc;
  --bg:#0d0f13; --panel:#151922; --ink:#e7eaef; --muted:#8f99a8; --line:#252b38; --line2:#1d232e;
  --accent:#748ffc; --accent-ink:#0d0f13;
  --ok:#4dab6f; --okbg:#142d1e; --warn:#f5a623; --warnbg:#33260f; --risk:#f27272; --riskbg:#3a1c1e;
  --info:#5c9df2; --infobg:#152a41; --chip:#1f2530; --chip2:#2a3140;
  --chart-a:#51cf66; --chart-b:#8193f8;
  --shadow:none; --shadow-lg:0 12px 32px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif}
html[data-theme=dark] body{color-scheme:dark}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
::selection{background:var(--accent);color:var(--accent-ink)}
.num,table b,.kpi b{font-variant-numeric:tabular-nums}

/* ── layout: sidebar + conteúdo ── */
.shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
aside.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:14px 12px;gap:4px;scrollbar-width:thin}
.side .brand{display:flex;gap:10px;align-items:center;font-weight:700;padding:6px 8px 14px}
.brand .mark{width:24px;height:24px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--dsug));
  display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800;flex:none}
.brand small{font-weight:400;color:var(--muted);font-size:11px;display:block}
nav.side-nav{display:flex;flex-direction:column;gap:2px}
nav.side-nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;color:var(--muted);
  font-size:13.5px;font-weight:500;white-space:nowrap}
nav.side-nav a:hover{text-decoration:none;color:var(--ink);background:var(--line2)}
nav.side-nav a.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);font-weight:650}
nav.side-nav .badge{margin-left:auto;min-width:17px;padding:0 5px;border-radius:9px;background:var(--riskbg);color:var(--risk);
  font-size:10.5px;font-weight:700;text-align:center}
.kbtn{margin:10px 6px 4px;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;border:1px dashed var(--line);
  color:var(--muted);font-size:12.5px;cursor:pointer;background:transparent}
.kbtn:hover{border-color:var(--accent);color:var(--accent)}
.kbtn b{margin-left:auto;font:11px ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:2px 5px}
.side .spacer{flex:1}
.bridge{margin:6px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
.bridge:hover{border-color:var(--accent)}
.bridge .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:7px;vertical-align:0}
.bridge.live .dot{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.bridge b{font-size:12.5px}
.bridge small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;width:32px;height:32px;
  cursor:pointer;font-size:14px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.iconbtn:hover{color:var(--accent);border-color:var(--accent)}
.iconbtn.is-dark{filter:invert(60%)}
.side .foot-row{display:flex;gap:8px;align-items:center;padding:6px}
.ownerchip{display:flex;gap:8px;align-items:center;min-width:0}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--chip2);display:inline-flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:var(--muted);flex:none}
.ownerchip small{color:var(--muted);display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

main.col{min-width:0;padding:22px 28px 80px}
.content{max-width:1200px;margin:0 auto}

/* ── página ── */
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:2px 0 14px;flex-wrap:wrap}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
h2.sec{font-size:15px;margin:26px 0 10px}
.pagehead .sub{margin:4px 0 0;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px}
.crumb{margin:14px 0 -6px}
.muted{color:var(--muted)}.small{font-size:12px}.more{margin:10px 0 0;font-size:13px}
.sug{color:var(--sug);font-weight:600}.dsug{color:var(--dsug);font-weight:600}.dsug em{font-style:normal;opacity:.85}
.late{color:var(--risk);font-weight:600}.soon{color:var(--warn);font-weight:600}.ok{color:var(--ok)}

/* ── kpis ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin:0 0 14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-bottom:4px}
.kpi b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em}
.kpi.ok::after,.kpi.risk::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.kpi.ok::after{background:var(--ok)}.kpi.risk::after{background:var(--risk)}
.kpi.ok b{color:var(--ok)}.kpi.risk b{color:var(--risk)}

/* ── painéis ── */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
h2{font-size:15px;margin:18px 0 10px}.panel h2:first-child{margin-top:0}
.panel[data-priority]{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
h3.day{font-size:11px;margin:16px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.panel h3.day:first-child{margin-top:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(400px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.mx{grid-template-columns:repeat(2,minmax(0,1fr))}

/* ── chips / ids ── */
.chip{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;
  background:var(--chip);color:var(--muted);white-space:nowrap;vertical-align:1px}
.h-em-risco{background:var(--riskbg);color:var(--risk)}.h-travado,.h-atencao{background:var(--warnbg);color:var(--warn)}
.h-em-dia,.h-concluido{background:var(--okbg);color:var(--ok)}.h-info{background:var(--infobg);color:var(--info)}
.idchip{font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--chip);color:var(--ink);
  padding:1px 7px;border-radius:6px;letter-spacing:.02em;white-space:nowrap;display:inline-block}
.td-ice{white-space:nowrap}
a:hover .idchip{background:var(--accent);color:var(--accent-ink)}

/* ── barras / donuts ── */
.bar{display:inline-block;width:110px;height:7px;border-radius:5px;background:var(--chip2);vertical-align:middle;margin-right:8px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:5px}
.donut text{fill:var(--ink);font-size:11px;font-weight:700}
.goal-head{display:flex;gap:14px;align-items:center}
.goal{border-left:3px solid var(--accent)}
.goal .proj{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.goal .proj:first-of-type{margin-top:10px}
.goal .proj .t{flex:1;min-width:0}.goal .proj .t small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.projcard-head{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.projcard .foot{margin-top:10px;padding-top:10px;border-top:1px solid var(--line2)}
.projcard{display:flex;flex-direction:column;justify-content:space-between}

/* ── listas ── */
ul.feed{list-style:none;padding:0;margin:0}
ul.feed li{padding:8px 2px;border-bottom:1px solid var(--line2);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
ul.feed li:last-child{border:0}
ul.feed li.warn{background:linear-gradient(90deg,color-mix(in srgb,var(--warn) 7%,transparent),transparent);border-radius:8px;padding-left:8px}
ul.feed li.info{background:linear-gradient(90deg,color-mix(in srgb,var(--info) 6%,transparent),transparent);border-radius:8px;padding-left:8px}
.health li{padding:8px 2px}.health .hicon{display:inline-block;width:20px;font-weight:700}

/* ── tabelas ── */
.twrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
th{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--panel)}
tbody tr:hover td{background:var(--line2)}
tr.sup td{color:var(--muted);text-decoration:line-through}

/* ── kanban ── */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;align-items:start}
.col{background:var(--chip);border-radius:var(--r);padding:10px;min-height:120px}
.col h3{margin:2px 4px 10px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700;
  display:flex;justify-content:space-between;align-items:center}
.col .count{background:var(--panel);border-radius:999px;padding:0 8px;font-size:11px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow);
  transition:transform .12s ease, box-shadow .12s ease}
.card:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.card.is-late{border-left:3px solid var(--risk)}
.card header{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card-title{font-weight:600;margin:5px 0 3px;font-size:13.5px}
.card-meta{font-size:12px;color:var(--muted);margin:0}
.card-block{font-size:12px;color:var(--risk);margin:6px 0 0}
.card .qa{margin-top:8px;display:none;gap:6px}
body.bridge-live .card .qa{display:flex}
.card.mini{padding:8px 10px}

/* ── trocador de faces (Execução | Portfólio) ── */
.faces{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;margin:0 4px 12px}
.faces button{flex:1;border:0;background:transparent;color:var(--muted);font-family:inherit;font-size:12px;font-weight:600;line-height:1;padding:7px 4px;border-radius:8px;cursor:pointer;
  text-transform:uppercase;letter-spacing:.05em}
.faces button:hover{color:var(--ink)}
.faces button.on{background:var(--panel);color:var(--accent);box-shadow:var(--shadow)}
.faces button small{display:block;font-weight:500;text-transform:none;letter-spacing:0;font-size:10px;color:var(--muted);margin-top:2px}

/* ── kanban de oportunidades ── */
.pf-kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(196px,1fr);gap:12px;align-items:start;overflow-x:auto;padding-bottom:8px}
.pf-kanban.lat-row{grid-auto-columns:minmax(280px,1fr);margin-top:12px}
.pf-col.lat{background:transparent;border:1px dashed var(--line);opacity:.9}
.pf-col.lat h3{color:var(--muted)}
.pf-card.is-sug{border-left:3px solid var(--sug)}
a.card{display:block;color:var(--ink)}
a.card:hover{text-decoration:none;border-color:var(--accent)}
.card.area-card{color:var(--ink)}
.s-ideia,.s-triagem{background:var(--chip);color:var(--muted)}.s-priorizada{background:var(--infobg);color:var(--info)}
.s-em-andamento,.s-piloto,.s-validando{background:var(--warnbg);color:var(--warn)}.s-entregue{background:var(--okbg);color:var(--ok)}
.s-em-espera{background:var(--chip);color:var(--ink)}.s-descartada{background:var(--riskbg);color:var(--risk)}
.rin{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;font-size:13px;margin-bottom:10px}



/* ── entregáveis e progresso ── */
.dmark{border:1.5px solid var(--muted);background:transparent;color:var(--muted);border-radius:50%;width:24px;height:24px;
  cursor:pointer;font-size:12px;line-height:1;padding:0;display:inline-flex;align-items:center;justify-content:center;vertical-align:-6px}
.dmark:hover{border-color:var(--accent);color:var(--accent)}
.dmark.is-done{border-color:var(--ok);color:var(--ok)}
.dmark.is-doing{border-color:var(--info);color:var(--info)}
.dmark.is-cancel{opacity:.5}
.btn.tiny{font-size:11px;padding:2px 8px;border-radius:6px}

/* ── perguntas e propostas ── */
.ask-opts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.ask-free{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.ask-free .rin{flex:1;min-width:220px;margin:0}

/* ── dropdown de filtro ── */
.dd{position:relative;display:inline-block;flex:none}
.dd-btn{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border:1px solid var(--line);
  border-radius:999px;background:var(--panel);color:var(--ink);font-family:inherit;font-size:14px;font-weight:600;line-height:1;cursor:pointer;
  transition:border-color .12s ease,color .12s ease}
.dd-btn:hover{border-color:var(--accent);color:var(--accent)}
.dd.open .dd-btn{border-color:var(--accent);color:var(--accent)}
.dd-chev{width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;
  transform:rotate(45deg) translateY(-1px);transition:transform .15s ease;flex:none}
.dd.open .dd-chev{transform:rotate(225deg) translateY(-.5px)}
.dd-pop{display:none;position:absolute;top:calc(100% + 7px);left:0;z-index:50;min-width:max(100%, 230px);max-height:320px;overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px}
.dd.open .dd-pop{display:block;animation:ddin .12s ease}
@keyframes ddin{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.dd-opt{padding:10px 14px;border-radius:9px;font-size:14px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.dd-opt:hover,.dd-opt.hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.dd-opt.on{color:var(--accent);font-weight:650}
.dd-opt.on:before{content:"\2713  ";font-weight:700}
.filters .chk input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}

/* ── barra de teclas (rodapé, como a TUI) ── */
.kbd-bar{position:fixed;left:var(--side);right:0;bottom:0;z-index:60;display:flex;gap:10px;align-items:center;
  padding:7px 16px;background:var(--panel);border-top:1px solid var(--line)}
.kctx{display:flex;gap:2px;flex-wrap:wrap;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.kctx::-webkit-scrollbar{display:none}
.kglobal{display:flex;gap:2px;margin-left:auto;flex:none}
.kkey{border:0;background:transparent;color:var(--ink);font-family:inherit;font-size:12.5px;font-weight:500;line-height:1;padding:6px 8px;border-radius:7px;cursor:pointer;white-space:nowrap}
.kkey:hover{background:var(--chip)}
.kkey kbd{font:11px ui-monospace,monospace;background:var(--chip);color:var(--accent);border-radius:5px;padding:2px 6px;margin-right:6px}
.kkey.dim{opacity:.4}
.kkey.gate kbd{background:var(--warnbg);color:var(--warn)}
.kbd-bar .knone{color:var(--muted);font-size:12px;padding:6px 2px}

/* ── teclado (mesmas teclas da TUI) ── */
.kbd-sel{outline:2px solid var(--accent);outline-offset:1px}
.khelp td,.khelp th{padding:4px 10px}
.khelp td:first-child{font:12px ui-monospace,monospace;color:var(--accent);white-space:nowrap}
.khelp .grp td{border-top:1px solid var(--line);padding-top:8px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.frow{display:grid;grid-template-columns:120px 1fr;gap:8px 10px;align-items:center;margin-bottom:8px}
.frow label{font-size:12.5px;color:var(--muted)}
.frow input,.frow select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;font-size:13px;width:100%;min-width:0}
.gatebadge{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--warnbg);color:var(--warn);font-size:11px;font-weight:700}
#burger{display:none;position:fixed;top:10px;left:10px;z-index:70}
#burger.open{color:var(--accent);border-color:var(--accent)}

/* botões rápidos (só com ponte ligada) */
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:4px 10px;font:inherit;
  font-size:12px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{border-style:dashed;color:var(--muted)}

/* ── arrastar e soltar ── */
.card[draggable]{cursor:grab;-webkit-user-select:none;user-select:none}
.card[draggable]:active{cursor:grabbing}
.card.dragging{opacity:.4;transform:scale(.985) rotate(-.4deg)}
.col.drop-hint{outline:2px dashed var(--accent);outline-offset:-4px;
  background:color-mix(in srgb,var(--accent) 7%,var(--chip))}
.col.drop-hint::after{content:"soltar aqui";display:block;text-align:center;font-size:11px;font-weight:700;
  color:var(--accent);padding:6px 0 2px;letter-spacing:.04em}
.card.just-moved{animation:justmoved 1.2s ease}
@keyframes justmoved{0%{box-shadow:0 0 0 3px var(--accent);transform:translateY(2px)}100%{box-shadow:var(--shadow);transform:none}}

/* ── filtros ── */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 16px;align-items:center}
select{padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:13px}
label.chk{color:var(--muted);font-size:13px;display:inline-flex;gap:6px;align-items:center}

/* ── linha do tempo ── */
.tl{position:relative;margin-left:8px;border-left:2px solid var(--line);padding-left:16px}
.tl .it{position:relative;padding:5px 0}
.tl .it:before{content:"";position:absolute;left:-22px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.tl .k-decisão:before{background:#7048e8}.tl .k-entrega:before,.tl .k-entregável:before{background:var(--ok)}
.tl .k-reunião:before{background:var(--info)}.tl .k-ação\ fechada:before{background:var(--muted)}
.tl .k-plano:before{background:var(--warn)}

/* ── foco ── */
.week{display:grid;gap:8px;margin-top:6px}
.wday{background:var(--chip);border-radius:10px;padding:8px}
.wday h3{margin:2px 4px 8px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.wslot{position:relative;height:400px;background:var(--panel);border-radius:9px;border:1px solid var(--line)}
.blk{position:absolute;left:5px;right:5px;border-radius:7px;background:var(--infobg);border-left:3px solid var(--info);padding:4px 8px;font-size:11px;overflow:hidden}
.blk.prop{border-left-style:dashed;opacity:.9}
.blk.busy{background:var(--chip);border-left:3px solid var(--muted);color:var(--muted);font-size:10.5px;z-index:1}
.blk:not(.busy){z-index:2}
.blk.conflict{outline:2px solid var(--risk);outline-offset:1px;background:var(--riskbg);border-left-color:var(--risk)}
.blk.reservable{cursor:pointer}
.blk.reservable:hover{outline:2px solid var(--accent);outline-offset:1px;filter:brightness(1.04)}
.planbtns{display:flex;gap:8px;align-items:center}
.hourmark{position:absolute;right:5px;transform:translateY(-50%);font-size:9.5px;color:var(--muted);opacity:.75;pointer-events:none;z-index:0}
.week .hcol .wslot{border-right:1px solid var(--line);border-radius:0 9px 9px 0;border-left:none}

/* ── outros ── */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:2px 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg text{fill:var(--muted);font-size:11px}
.msg{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:12px;margin:8px 0 0;font-size:13.5px}
.msgrow header{font-size:13px}
.funnelchips{display:flex;gap:6px;flex-wrap:wrap}
.note{margin-top:14px}
.empty{color:var(--muted);padding:10px 14px;border:1px dashed var(--line);border-radius:9px;font-size:13px}
details summary{cursor:pointer}details summary:hover{color:var(--accent)}

/* ── ⌘K paleta ── */
.pal-back{position:fixed;inset:0;background:rgba(10,12,16,.38);z-index:90;display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 16px}
.pal-back.open{display:flex}
.palette{width:640px;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden}
.palette .pin{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.palette .pin input{flex:1;border:0;background:transparent;color:var(--ink);font:15px/1.4 inherit;outline:0;min-width:0}
.palette .pin .hint{font:11px ui-monospace,monospace;color:var(--muted)}
.pal-list{max-height:46vh;overflow-y:auto;padding:6px}
.pal-group{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:8px 10px 4px}
.pal-item{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:13.5px}
.pal-item .ent{font:11.5px ui-monospace,monospace;color:var(--muted)}
.pal-item.sel,.pal-item:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.pal-item .cmd{font:12px ui-monospace,monospace;color:var(--accent);margin-left:auto;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-item.off{opacity:.55}
.pal-empty{padding:18px;text-align:center;color:var(--muted);font-size:13px}
.pal-confirm{border-top:1px solid var(--line);padding:12px 14px;background:var(--bg);display:none}
.pal-confirm.open{display:block}
.pal-confirm .cline{font:12.5px ui-monospace,monospace;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:10px;overflow-x:auto;white-space:nowrap}
.pal-confirm .row{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.pal-confirm .note-s{font-size:11.5px;color:var(--muted);margin-right:auto}

/* ── console da ponte ── */
.console{position:fixed;top:0;right:0;bottom:0;left:auto;z-index:80;background:var(--panel);border-left:1px solid var(--line);
  box-shadow:-8px 0 24px rgba(16,24,40,.08);transform:translateX(100%);transition:transform .18s ease;width:min(420px,92vw);display:flex;flex-direction:column}
.console.open{transform:translateX(0)}
.console header{display:flex;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:650}
.console header .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.console header .x{margin-left:auto;cursor:pointer;color:var(--muted);border:0;background:none;font-size:15px}
.console pre{margin:0;padding:10px 16px;overflow-y:auto;flex:1;min-height:0;font:12px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;scrollbar-width:thin}
.toprow{display:flex;justify-content:flex-end;align-items:center;padding:10px 14px 0;gap:10px}
@media (max-width:900px){.toprow{justify-content:space-between}}
.clidot{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);
  border-radius:999px;padding:5px 11px;cursor:pointer;font:600 12px/1 inherit;color:var(--muted);position:relative;z-index:90;
}
body.con-open .clidot{display:none}
.clidot .cdot{width:9px;height:9px;border-radius:50%;background:var(--risk);transition:background .15s}
.clidot.live .cdot{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent)}
.clidot.live{color:var(--ink)}
.clidot .conbadge{position:absolute;top:-6px;right:-6px;background:var(--accent);color:#fff;border-radius:9px;
  font-size:10px;font-weight:700;line-height:1;padding:2px 6px;display:none}
.clidot .conbadge.on{display:inline-block}
.console .ok{color:var(--ok)}.console .err{color:var(--risk)}.console .dim{color:var(--muted)}
main.col{padding-bottom:120px}

/* toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,80px);background:var(--ink);color:var(--bg);
  padding:9px 16px;border-radius:10px;font-size:13px;z-index:95;opacity:0;transition:all .2s ease;box-shadow:var(--shadow-lg)}
.toast.show{transform:translate(-50%,0);opacity:1}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  aside.side{position:fixed;left:-260px;width:240px;z-index:60;transition:left .2s ease;box-shadow:var(--shadow-lg)}
  aside.side.open{left:0}
  .kanban{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}
  main.col{padding:16px 14px 120px}
  .kbd-bar{left:0}
  #burger{display:inline-flex}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side">
    <div class="brand"><span class="mark">SC</span><span>Segundo Cérebro<small id="gen">demo</small></span></div>
    <div class="faces" id="faces"></div>
    <nav class="side-nav" id="tabs"></nav>
    <button class="kbtn" id="openpal">Comandos e busca<span><b>⌘K</b></span></button>
    <div class="spacer"></div>
    <div class="foot-row">
      <div class="ownerchip"><span class="avatar" id="avatar">V</span><span><b class="own-name" id="ownername">—</b><small id="gen2"></small></span></div>
      <div class="spacer"></div>
      <button class="iconbtn" id="theme" title="alternar tema">☀</button>
    </div>
  </aside>
  <main class="col">
    <div class="toprow">
      <button class="iconbtn" id="burger" title="menu (mostra a barra lateral)">≡</button>
      <button class="clidot" id="clidot" title="ponte CLI — clique para abrir/fechar o console (`)">
        <span class="cdot"></span><small>CLI</small><span class="conbadge" id="conbadge" title="linhas novas no console"></span>
      </button>
    </div>
    <div class="content" id="view"></div></main>
</div>

<div class="pal-back" id="palback">
  <div class="palette" role="dialog" aria-label="Paleta de comandos">
    <div class="pin"><input id="palq" placeholder="Buscar ou rodar: tente  TASK, foco, aprovar, ou digite  brain …" autocomplete="off" spellcheck="false"><span class="hint">↑↓ · ↵</span></div>
    <div class="pal-list" id="pallist"></div>
    <div class="pal-confirm" id="palconfirm">
      <div class="cline" id="palcmd"></div>
      <div class="row">
        <span class="note-s" id="palnote"></span>
        <button class="btn ghost" id="palcancel">cancelar</button>
        <button class="btn primary" id="palrun">executar</button>
      </div>
    </div>
  </div>
</div>

<div class="console" id="console">
  <header><span class="dot"></span> console <span class="muted small" id="conmode"></span><button class="x" id="conx" title="fechar">×</button></header>
  <pre id="conout"></pre>
</div>
<div class="toast" id="toast"></div>

<script id="data" type="application/json">__DATA__</script>
<script>window.PF_ONLY = false;
/* VARIANTE B extras — paleta ⌘K + ponte CLI simulada (mesmos comandos que o TUI dispara). */
(function(){
"use strict";
const D0 = JSON.parse(document.getElementById("data").textContent);
D0.counts = D0.counts || {}; D0.questions = D0.questions || []; D0.proposals = D0.proposals || [];
D0.outbox = D0.outbox || []; D0.health = D0.health || []; D0.deliveries = D0.deliveries || [];
D0.actions = D0.actions || []; D0.shares = D0.shares || []; D0.people = D0.people || [];
D0.projects = D0.projects || []; D0.goals = D0.goals || []; D0.decisions = D0.decisions || [];
D0.portfolio = D0.portfolio || {areas: [], processes: [], opportunities: [], gaps: []};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

// ── sidebar: dono + data ────────────────────────────────────────────────
$("#ownername").textContent = D0.owner.name;
$("#avatar").textContent = D0.owner.name.trim().slice(0, 1).toUpperCase();
$("#gen2").textContent = "gerado " + D0.generated_at.slice(0, 10);

window.renderTabs = function(view, TABS, PARENT){
  document.getElementById("tabs").innerHTML = TABS.map(function(t){
    const n = t[2] ? t[2]() : 0;
    return '<a href="#' + t[0] + '" class="' + ((view === t[0] || PARENT[view] === t[0]) ? "on" : "") + '">' + t[1] +
      (n ? '<span class="badge">' + n + "</span>" : "") + "</a>";
  }).join("");
};
window.renderFaces = function(face){
  const fs = window.PF_ONLY ? [["portfolio", "Portfólio"]]
    : [["execucao", "Execução"], ["portfolio", "Portfólio"]];
  document.getElementById("faces").innerHTML = fs.map(function(f){
    return '<button class="' + (face === f[0] ? "on" : "") + '" data-f="' + f[0] + '" title="Tab/Shift+Tab na TUI">' + f[1] + "</button>";
  }).join("");
  document.querySelectorAll("#faces button").forEach(b => b.onclick = () => { location.hash = "#face/" + b.dataset.f; });
};

// ── toast + console ─────────────────────────────────────────────────────
let toastTmr;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTmr); toastTmr = setTimeout(() => t.classList.remove("show"), 2800); }
let conAuto = sessionStorage.getItem("con-fechado") !== "1";   // quem fechou, ficou fechado
let conUnread = 0;
function conToggle(force){
  const el = $("#console"), open = el.classList.contains("open");
  const on = force !== undefined ? force : !open;
  el.classList.toggle("open", on);
  document.body.classList.toggle("con-open", on);
  conAuto = on;                                              // abrir de novo reativa o auto-open
  if (on) { conUnread = 0; const b = $("#conbadge"); if (b) { b.textContent = ""; b.classList.remove("on"); }
            sessionStorage.removeItem("con-fechado"); $("#conout").scrollTop = 1e6; }
  else sessionStorage.setItem("con-fechado", "1");
}
function conOpen(){ if (conAuto) $("#console").classList.add("open"); }
function conLine(html){
  const out = $("#conout");
  out.innerHTML += html + "\n";
  const lines = out.innerHTML.split("\n");                   // buffer limitado: as últimas 300 linhas
  if (lines.length > 300) out.innerHTML = lines.slice(-300).join("\n");
  out.scrollTop = 1e6;
  if (!$("#console").classList.contains("open")) {            // fechado: conta não-lidas na pílula
    conUnread++; const b = $("#conbadge"); if (b) { b.textContent = conUnread > 50 ? "50+" : conUnread; b.classList.add("on"); } }
}
$("#conx").onclick = () => conToggle(false);
(function(){ const ci = document.querySelector("#clidot");   // ponto CLI no canto direito do topo
  if (ci) ci.onclick = () => conToggle(); })();

// ── ponte CLI: ./brain serve (127.0.0.1 + token). file:// continua sendo retrato somente-leitura ──
const SERVE = location.protocol === "http:" && location.hostname === "127.0.0.1";
let TOK = null;
if (SERVE) {
  const m = location.hash.match(/[#&]t=([^&]+)/);
  if (m) { TOK = decodeURIComponent(m[1]); try { localStorage.setItem("brain-serve-token", TOK); } catch (e) {}
           history.replaceState(null, "", location.pathname + location.search); }
  else { try { TOK = localStorage.getItem("brain-serve-token"); } catch (e) {} }
}
let LIVE = SERVE && !!TOK;
function copyCmd(cmd){
  const t = document.createElement("textarea");
  t.value = cmd; t.style.position = "fixed"; t.style.opacity = "0";
  document.body.appendChild(t); t.select();
  try { document.execCommand("copy"); } catch (e) {}
  t.remove();
}
function offlineCmd(cmd){
  copyCmd(cmd);
  conOpen();
  conLine('<span class="dim">$</span> ' + esc(cmd));
  conLine('<span class="ok">copiado</span> <span class="dim">— rode no terminal (mesma linha que o TUI dispara) · views: brain render</span>');
  toast("comando copiado — rode no terminal");
}
if (LIVE) {
  const cm = document.querySelector("#conmode");
  if (cm) cm.textContent = "vivo — comandos executam";
  document.body.classList.add("bridge-live");
  const ci = document.querySelector("#clidot");
  if (ci) { ci.classList.add("live"); ci.title = "ponte CLI conectada — comandos executam (clique/\` para o console)"; }
} else {
  const ci = document.querySelector("#clidot");
  if (ci) ci.title = "ponte CLI offline — retrato: comandos são copiados (clique/\` para o console)";
}

// ── comandos (mesmas linhas que o TUI roda) ────────────────────────────
function commands(){
  const out = [];
  const MD = (window.BRAIN && window.BRAIN.M) || D0;   // model vivo: o que já rodou sai da paleta
  const mine = MD.actions.filter(a => a.open && a.mine && a.list === "mine");
  mine.filter(a => a.status === "aberta").forEach(a => out.push({label: "Marcar fazendo · " + a.id + " " + a.title,
    cmd: "brain action update " + a.id + " --status fazendo", mut: m => { m.actions.find(x => x.id === a.id).status = "fazendo"; }}));
  mine.forEach(a => out.push({label: "Fechar · " + a.id + " " + a.title,
    cmd: 'brain action close ' + a.id + ' --how "feito pelo painel"',
    mut: m => { const x = m.actions.find(y => y.id === a.id); x.open = false; x.status = "fechada"; x.closed = m.today; }}));
  MD.actions.filter(a => a.open && a.due_suggested).forEach(a => out.push({label: "Confirmar prazo sugerido · " + a.id + " (" + (a.due || "").slice(0, 10) + ")",
    cmd: "brain action update " + a.id + " --confirm-due", mut: m => { m.actions.find(x => x.id === a.id).due_suggested = false; }}));
  if (D0.focus && D0.focus.status === "proposto") {
    out.push({label: "Aprovar plano de foco " + D0.focus.id + ' (quote "ok")',
      cmd: 'brain focus approve ' + D0.focus.id + ' --quote "ok"', mut: m => { m.focus.status = "aprovado"; m.focus.quote = "ok"; }});
    out.push({label: "Aprovar e aplicar " + D0.focus.id + " no Google Calendar",
      cmd: "brain focus apply " + D0.focus.id + " --mode google",
      mut: m => { m.focus.status = "aplicado"; m.focus.applied = m.focus.blocks; m.focus.mode = "google"; }});
  }
  MD.outbox.filter(m0 => m0.status === "rascunho").forEach(m0 => out.push({label: "Aprovar mensagem " + m0.id + " para " + m0.to_name,
    cmd: 'brain outbox approve ' + m0.id + ' --quote "enviar 1"', mut: m => { m.outbox.find(x => x.id === m0.id).status = "aprovada"; }}));
  MD.proposals.forEach(p => {
    out.push({label: "Aceitar proposta " + p.id + " · " + p.summary.slice(0, 60) + "…",
      cmd: 'brain proposal accept ' + p.id + ' --quote "ok"', mut: m => { m.proposals = m.proposals.filter(x => x.id !== p.id); }});
    out.push({label: "Rejeitar proposta " + p.id,
      cmd: 'brain proposal reject ' + p.id + ' --quote "não"', mut: m => { m.proposals = m.proposals.filter(x => x.id !== p.id); }});
  });
  out.push({label: "Regenerar views (render)", cmd: "brain render"});
  return out;
}

async function api(path, opts){
  const headers = Object.assign({"X-Brain-Token": TOK}, (opts && opts.headers) || {});
  const r = await fetch(path, Object.assign({}, opts, {headers}));
  if (r.status === 401) { toast("token inválido — rode ./brain serve e abra a URL impressa"); throw new Error("401"); }
  return r.json();
}
async function serveRun(cmd){
  conOpen();
  conLine('<span class="dim">$</span> ' + esc(cmd));
  let j;
  try {
    j = await api("/api/cmd", {method: "POST", headers: {"Content-Type": "application/json"},
                              body: JSON.stringify({cmd: cmd})});
  } catch (e) { conLine('<span class="late">ponte fora do ar — ./brain serve</span>'); return false; }
  (j.out || []).forEach(l => conLine('<span class="' + (l.startsWith("✓") ? "ok" : "dim") + '">' + esc(l) + "</span>"));
  if (j.err) conLine('<span class="late">' + esc(j.err.split("\n")[0]) + "</span>");
  if (j.error) conLine('<span class="late">' + esc(j.error) + "</span>");
  if (!j.ok) { toast("comando recusado — saída no console"); return false; }
  try {
    const d = await api("/api/data");
    if (window.BRAIN && window.BRAIN.refresh) window.BRAIN.refresh(d.model);
  } catch (e) { /* views regeneram no próximo brain render */ }
  return true;
}
// fatos do dono levam --by owner — a mesma convenção das linhas que o TUI dispara
const NEEDS_BY = ["action ", "area ", "decision add", "delivery ", "person ", "process ",
  "opportunity add", "opportunity update", "opportunity score", "opportunity status", "plan deliverable"];
function ownerCmd(cmd){
  const bare = cmd.replace(/^brain /, "");
  return NEEDS_BY.some(x => bare.startsWith(x)) && !/\s--by(\s|=)/.test(bare) ? cmd + " --by owner" : cmd;
}
function runCommand(cmd, mut){
  cmd = ownerCmd(cmd);
  if (LIVE) { serveRun(cmd); return; }
  { offlineCmd(cmd); return; }
}

// ── paleta ⌘K ───────────────────────────────────────────────────────────
const pal = {open: false, sel: 0, items: [], confirmCmd: null, confirmMut: null};
function navEntries(){
  const tabs = [["face/execucao", "→ face Execução"], ["face/portfolio", "→ face Portfólio"],
    ["home", "Início"], ["todo", "TODO"], ["projects", "Projetos"], ["decisions", "Decisões"], ["wins", "Conquistas"],
    ["people", "Pessoas"], ["timeline", "Linha do tempo"], ["focus", "Foco"], ["outbox", "Mensagens"], ["health", "Saúde"],
    ["pf/visao", "Portfólio · Visão"], ["pf/opps", "Portfólio · Oportunidades"], ["pf/matrix", "Portfólio · Matriz"],
    ["pf/procs", "Portfólio · Processos"], ["pf/areas", "Portfólio · Áreas"]];
  return tabs.map(t => ({group: t[0].startsWith("face/") ? "faces" : "ir para", label: t[1], view: t[0]}));
}
function entEntries(){
  const out = [];
  D0.actions.filter(a => a.open).forEach(a => out.push({group: "ações abertas", label: a.title, ent: a.id, view: "action/" + a.id}));
  D0.decisions.slice(0, 8).forEach(d => out.push({group: "decisões", label: d.title, ent: d.id, view: "decision/" + d.id}));
  D0.projects.forEach(p => out.push({group: "projetos", label: p.id + " " + p.title, ent: p.id, view: "project/" + p.id}));
  D0.people.forEach(p => out.push({group: "pessoas", label: p.name, ent: p.id, view: "person/" + encodeURIComponent(p.id)}));
  return out;
}
function buildItems(q){
  const nq = norm(q);
  const free = /^brain\s/.test(q) ? [{group: "linha livre", label: "executar: " + q, cmd: q, mut: null}] : [];
  const all = [...navEntries(), ...entEntries(), ...commands().map(c => ({group: "comando", label: c.label, cmd: c.cmd, mut: c.mut || null}))];
  const f = nq ? all.filter(it => norm(it.label + " " + (it.ent || "") + " " + (it.cmd || "") + " " + it.group).includes(nq)) : all;
  return [...free, ...f.slice(0, 30)];
}
function renderPal(){
  const list = $("#pallist");
  if (!pal.items.length) { list.innerHTML = '<div class="pal-empty">nada encontrado — "não consta"</div>'; return; }
  let last = "", h = "";
  pal.items.forEach((it, i) => {
    if (it.group !== last) { h += '<div class="pal-group">' + esc(it.group) + "</div>"; last = it.group; }
    h += '<div class="pal-item' + (i === pal.sel ? " sel" : "") +  '" data-i="' + i + '">' +
      (it.ent ? '<span class="ent">' + esc(it.ent) + "</span>" : "") + "<span>" + esc(it.label) + "</span>" +
      (it.cmd ? '<span class="cmd">' + esc(it.cmd) + "</span>" : "") + "</div>";
  });
  list.innerHTML = h;
  list.querySelectorAll(".pal-item").forEach(el => {
    el.onmouseenter = () => { pal.sel = +el.dataset.i; renderPal(); };
    el.onclick = () => pick(+el.dataset.i);
  });
}
function pick(i){
  const it = pal.items[i]; if (!it) return;
  if (it.view) { closePal(); location.hash = it.view; return; }
  if (it.cmd) {
    pal.confirmCmd = it.cmd; pal.confirmMut = it.mut;
    $("#palcmd").textContent = "$ " + it.cmd;
    $("#palnote").textContent = LIVE
      ? "mesma linha que o TUI roda — gates e ledger valem igual"
      : "retrato: o comando é copiado para o terminal";
    $("#palrun").textContent = LIVE ? "executar" : "copiar";
    $("#palconfirm").classList.add("open");
  }
}

// ── kanban: botões rápidos + arrastar e soltar (ponte CLI) ──────────────
function colOf(a){ if (!a.open) return "fechada"; return (a.status === "bloqueada" || a.status === "aguardando") ? "aguardando" : a.status; }
function dropPlan(a, target){                    // → {cmd, mut, deny?}
  const from = colOf(a);
  if (from === target) return null;
  if (target === "fechada")
    return {cmd: 'brain action close ' + a.id + ' --how "arrastada para Feita no painel"',
      mut: m => { const x = m.actions.find(y => y.id === a.id); x.open = false; x.status = "fechada"; x.closed = m.today; }};
  if (!a.open)
    return {cmd: 'brain action reopen ' + a.id + ' --reason "reaberta no painel"',
      mut: m => { const x = m.actions.find(y => y.id === a.id); x.open = true; x.status = target === "aguardando" ? "aguardando" : target; x.closed = null; }};
  if (a.blocked_by.length && target !== "aguardando")
    return {deny: a.id + " segue bloqueada por " + a.blocked_by.join(", ") + " — resolva o bloqueio para movê-la"};
  return {cmd: "brain action update " + a.id + " --status " + (target === "aguardando" ? "aguardando" : target),
    mut: m => { m.actions.find(y => y.id === a.id).status = target === "aguardando" ? "aguardando" : target; }};
}
let dragId = null, lastMoved = null;
window.afterRoute = function(view){
  if (location.hash.startsWith("#focus")) wireFocus();
  if (location.hash.startsWith("#pf/opps")) wireOppKanban();
  if (location.hash.startsWith("#ask")) wireAskPage();
  wireP0();
  collectSel();
  document.querySelectorAll("#view .card").forEach(el => {
    if (el.querySelector(".qa")) return;
    const idEl = el.querySelector(".idchip"); if (!idEl) return;
    const id = idEl.textContent.trim();
    const a = (window.BRAIN ? window.BRAIN.M : D0).actions.find(x => x.id === id); if (!a) return;
    if (a.open) {
      el.setAttribute("draggable", "true");
      el.addEventListener("dragstart", e => {
        dragId = id; lastMoved = null;
        e.dataTransfer.setData("text/plain", id); e.dataTransfer.effectAllowed = "move";
        setTimeout(() => el.classList.add("dragging"), 0);
      });
      el.addEventListener("dragend", () => { el.classList.remove("dragging"); dragId = null;
        document.querySelectorAll(".col.drop-hint").forEach(c => c.classList.remove("drop-hint")); });
    }
    const qa = document.createElement("div"); qa.className = "qa";
    if (a.open && a.status === "aberta") qa.innerHTML = '<button class="btn" data-c="fazendo">▶ fazendo</button>';
    if (a.open) qa.innerHTML += '<button class="btn" data-c="fechar">✓ fechar</button>';
    if (qa.innerHTML) el.appendChild(qa);
    qa.querySelectorAll("button").forEach(b => b.onclick = ev => {
      ev.preventDefault(); ev.stopPropagation();
      if (b.dataset.c === "fechar")
        runCommand('brain action close ' + id + ' --how "feito pelo painel"', m => {
          const x = m.actions.find(y => y.id === id); x.open = false; x.status = "fechada"; x.closed = m.today; lastMoved = id; });
      else
        runCommand("brain action update " + id + " --status fazendo", m => { m.actions.find(x => x.id === id).status = "fazendo"; lastMoved = id; });
    });
  });
  // zonas de solta: as colunas do kanban
  document.querySelectorAll("#view .kanban .col").forEach(col => {
    col.addEventListener("dragover", e => {
      if (!dragId) return;
      e.preventDefault(); e.dataTransfer.dropEffect = "move";
      col.classList.add("drop-hint");
    });
    col.addEventListener("dragleave", () => col.classList.remove("drop-hint"));
    col.addEventListener("drop", e => {
      e.preventDefault(); col.classList.remove("drop-hint");
      const id = dragId || e.dataTransfer.getData("text/plain"); dragId = null;
      const a = window.BRAIN.M.actions.find(x => x.id === id); if (!a) return;
      const plan = dropPlan(a, col.dataset.col); if (!plan) return;
      if (plan.deny) { toast(plan.deny); return; }
      lastMoved = id;
      if (!LIVE) { offlineCmd("" + plan.cmd); return; }
      runCommand(plan.cmd, plan.mut);
    });
  });
  // flash do cartão que acabou de se mover (o "live" do arrasto)
  if (lastMoved) {
    const el = [...document.querySelectorAll("#view .card")].find(c => {
      const i = c.querySelector(".idchip"); return i && i.textContent.trim() === lastMoved; });
    if (el) { el.classList.add("just-moved"); setTimeout(() => el.classList.remove("just-moved"), 1200); }
    lastMoved = null;
  }
};

    "</div></div>" + days.map(d => '<div class="wday"><h3>' + fmtDW(d) + '</h3><div class="wslot" style="' + gridBg + '">' +
    busy.filter(e => e.start.startsWith(d)).map(e => { const top = (toMin(e.start) - minS) / span * 100, hgt = (toMin(e.end) - toMin(e.start)) / span * 100;
      return '<div class="blk busy" style="top:' + top + "%;height:" + hgt + '%"><b>' + e.start.slice(11, 16) + "–" + e.end.slice(11, 16) + "</b> " + esc(e.title || "ocupado") + "</div>"; }).join("") +
    blocks.filter(b => b.start.startsWith(d)).map(b => { const top = (toMin(b.start) - minS) / span * 100, hgt = (toMin(b.end) - toMin(b.start)) / span * 100, a = A[b.action];

  if (f.at_risk.length) h += panel("⚠ Não cabe antes do prazo", '<ul class="feed">' + f.at_risk.map(r => "<li>" + aL(r.action) + " " + esc((A[r.action] || {}).title || "") + " · prazo " + fmtDW(r.due) + " · faltam <b>" + dur(r.shortfall_min) + "</b> de " + dur(r.needed_min) + "</li>").join("") + "</ul>", ' data-priority');

V["pf/matrix"] = () => {
  const QUADS = [["ganho rápido", "impacto alto · facilidade alta"], ["aposta", "impacto alto · facilidade baixa"],

  return '<div class="pagehead"><div><h1>Matriz impacto × facilidade</h1><p class="sub">Notas ≥ 3 contam como altas. Fora da matriz: sem ICE.</p></div></div>' +
    panel("", '<div class="grid mx">' + QUADS.map(([qn, d]) => '<div class="col"><h3>' + qn + ' <span class="muted">· ' + d + "</span></h3>" +
      ((PF.matrix[qn] || []).map(i => OPP[i]).filter(Boolean).sort((a, b) => (b.score ?? -1) - (a.score ?? -1)).map(o =>
        '<a class="card mini" href="#pf/opp/' + encodeURIComponent(o.id) + '"><span class="ids">' + esc(o.id) + '</span><div class="card-title">' + esc(o.title) + '</div><p class="card-meta">' +

};
V["pf/procs"] = (q) => {

      rows.map(p => "<tr><td>" + idc(p.id) + "</td><td>" + esc(p.title) + (p.status !== "ativo" ? " " + chip("s-descartada", "aposentado") : "") + "</td><td>" + (p.owner ? peL(p.owner) : "—") +
        "</td><td>" + esc(p.recurrence || "—") + '</td><td class="num">' + hrs(p.hours_month) + '</td><td class="num">' + p.opportunities.length + "</td><td>" +

V["pf/areas"] = () => '<div class="pagehead"><div><h1>Áreas</h1></div></div>' + panel("", '<div class="twrap"><table><tr><th>Área</th><th>Também chamada</th><th>Processos</th><th>Horas/mês</th><th>Oportunidades</th><th>Priorizadas</th></tr>' +
  PF.areas.map(a => { const procs = PF.processes.filter(p => p.area === a.id && p.status === "ativo"), opps = PF.opportunities.filter(o => o.area === a.id);
    return '<tr><td><b><a href="#pf/area/' + enc(a.id) + '">' + esc(a.name) + "</a></b></td>" + '<td class="muted">' + a.aliases.map(esc).join(", ") + '</td><td class="num">' + procs.length + '</td><td class="num">' +
      hrs(procs.reduce((t, p) => t + (p.hours_month || 0), 0)) + '</td><td class="num">' + opps.length + '</td><td class="num">' + opps.filter(o => o.status === "priorizada").length + "</td></tr>"; }).join("") + "</table></div>");

V["pf/area"] = (q, id) => {
  const a = AREA[decodeURIComponent(id || "")]; if (!a) return empty("Área não encontrada");
  const procs = PF.processes.filter(x => x.area === a.id);
  const active = procs.filter(x => x.status === "ativo");
  const opps = PF.opportunities.filter(o => o.area === a.id).sort((x, y) => (y.score || 0) - (x.score || 0) || x.id.localeCompare(y.id));
  const ppl = [...new Set([...active.flatMap(x => [x.owner, ...(x.executors || [])]), ...opps.flatMap(o => o.people || [])])].filter(Boolean);
  let h = '<p class="crumb muted"><a href="#pf/areas">← áreas</a></p>' +
    '<div class="pagehead"><div><h1>' + esc(a.name) + "</h1>" +
    '<div class="sub">' + (a.aliases.length ? "<span>também: " + a.aliases.map(esc).join(", ") + "</span>" : "") +
    "<span>" + active.length + " " + (active.length === 1 ? "processo ativo" : "processos ativos") + "</span><span>" + hrs(active.reduce((t, x) => t + (x.hours_month || 0), 0)) + "</span>" +
    "<span>" + opps.length + " " + (opps.length === 1 ? "oportunidade" : "oportunidades") + "</span>" + (a.note ? "<span>" + esc(a.note) + "</span>" : "") + "</div></div></div>";
  h += '<div class="grid g2">' +
    panel("Processos · " + procs.length, '<div class="twrap"><table><tr><th>ID</th><th>Processo</th><th>Responsável</th><th>Recorrência</th><th>Horas/mês</th><th>Lacunas</th></tr>' +
      (procs.length ? procs.map(x => "<tr><td>" + idc(x.id) + "</td><td>" + esc(x.title) + (x.status !== "ativo" ? " " + chip("s-descartada", "aposentado") : "") + "</td><td>" +
        (x.owner ? peL(x.owner) : "—") + "</td><td>" + esc(x.recurrence || "—") + '</td><td class="num">' + hrs(x.hours_month) + "</td><td>" +
        (x.gaps.length ? '<span class="late">⚠ ' + x.gaps.map(esc).join("; ") + "</span>" : '<span class="ok">✓</span>') + "</td></tr>").join("")
      : "<tr><td colspan=6>" + empty("—") + "</td></tr>") + '</table></div><p class="more"><a href="#pf/procs?area=' + enc(a.id) + '">lista de processos filtrada →</a></p>') +
    panel("Oportunidades · " + opps.length, '<div class="twrap"><table><tr><th>ID</th><th>Oportunidade</th><th>ICE</th><th>Status</th><th>Ganho</th></tr>' +
      (opps.length ? opps.map(o => "<tr><td>" + oL(o.id) + "</td><td>" + esc(o.title) + '</td><td class="td-ice">' + iceTxt(o) + "</td><td>" + stChip(o.status) +
        '</td><td class="num">' + hrs(o.hours_saved) + "</td></tr>").join("")
      : "<tr><td colspan=5>" + empty("—") + "</td></tr>") + "</table></div>") + "</div>";
  h += panel("Pessoas · " + ppl.length, ppl.length ? ppl.map(x => peL(x) + ' <span class="muted small">' + esc((PE[x] || {}).role || "") + "</span>").join(" · ")
    : empty("ninguém ligado a esta área ainda"), ' style="margin-top:14px"');
  return h;
};
V["pf/opp"] = (q, id) => {
  const o = OPP[id]; if (!o) return empty("Oportunidade não encontrada");
  const proc = PROC[o.process];
  let h = '<p class="crumb muted"><a href="#pf/opps">← oportunidades</a></p><div class="pagehead"><div><h1>' + esc(o.id) + " · " + esc(o.title) + "</h1>" +
    '<div class="sub">' + stChip(o.status) + chip("", o.kind) + "<span>" + esc(areaName(o.area)) + "</span>" + (o.quadrant ? chip("", o.quadrant) : "") +
    "<span>ICE " + iceTxt(o) + "</span></div></div></div>";
  h += '<div class="grid g2">' + panel("Resumo", '<ul class="feed"><li><b>Ganho esperado:</b> ' + esc(o.gain || "não consta") + (o.hours_saved ? " · " + hrs(o.hours_saved) : "") + "</li>" +
    "<li><b>Processo:</b> " + (o.process ? idc(o.process) + " " + esc(proc ? proc.title : "") : "—") + "</li>" +
    "<li><b>Goal:</b> " + (o.goal ? esc(o.goal) + " " + esc(o.goal_title || "") : "—") + "</li>" +
    "<li><b>Projeto:</b> " + (o.project ? pL(o.project, true) : "—") + "</li>" +
    '<li><b>Registrada:</b> ' + fmtD(o.added) + " · por " + esc(o.by === "owner" ? "dono" : "agente") + " [" + esc(o.prov) + "]</li></ul>");
  h += panel("Problema → Sugestão", '<div class="msg">' + esc(o.problem || "não consta") + '</div><div class="msg">' + esc(o.suggestion || "não consta") + "</div>") + "</div>";
  if (o.docs.length) h += panel("Documentos", '<ul class="feed">' + o.docs.map(d => "<li>" + chip("info", d.kind) + " " + esc(d.title || d.ref) + "</li>").join("") + "</ul>", ' style="margin-top:14px"');
  h += panel("Histórico de status", o.status_history.length ? '<ul class="feed">' + o.status_history.map(x => "<li><span class=\"muted\">" + fmtD(x.date) + "</span> · " + stChip(x.from) + " → " + stChip(x.to) +
    (x.reason ? ' <span class="muted">(' + esc(x.reason) + ")</span>" : "") + "</li>").join("") + "</ul>" : empty("criada em " + fmtD(o.added) + " como " + o.status), ' style="margin-top:14px"');
  return h;
};
V.portfolio = () => { location.hash = "#pf/visao"; return ""; };   // compat: link antigo


// ── perguntas do agente (ASK-####) e propostas (PROP-####) ──────────────
V.ask = () => {
  const qs = M.questions || [], abertas = qs.filter(q => q.status === "aberta"), feitas = qs.filter(q => q.status !== "aberta");
  let h = '<div class="pagehead"><div><h1>Perguntas e propostas</h1><p class="sub">O agente pergunta (ASK-####) — só o dono responde. Propostas PROP-#### o dono aceita/rejeita com a resposta literal.</p></div></div>';
  h += panel("Perguntas abertas · " + abertas.length, abertas.length ? abertas.map(q =>
    '<div class="card" data-ask="' + esc(q.id) + '" style="margin:0 0 10px">' +
    '<header><span class="ids">' + idc(q.id) + "</span>" + chip("info", q.kind) +
    (q.run ? ' <span class="muted small">rodada ' + esc(q.run) + "</span>" : "") + "</header>" +
    '<h3 class="card-title">' + esc(q.text) + "</h3>" +
    (q.options && q.options.length ? '<div class="ask-opts">' + q.options.map(o => '<button class="btn" data-opt="' + esc(o) + '">' + esc(o) + "</button>").join("") + "</div>" : "") +
    '<div class="ask-free"><input class="rin" data-free placeholder="ou responda com texto livre…"><button class="btn" data-send>responder</button>' +
    '<button class="btn ghost" data-drop title="brain ask drop --reason">descartar</button></div>' +
    (q.context ? '<p class="muted small">contexto: ' + esc(q.context) + "</p>" : "") +
    "</div>").join("") : empty("nenhuma pergunta aberta"));
  h += panel("Propostas abertas · " + M.proposals.length, M.proposals.length ? M.proposals.map(pr =>
    '<div class="card" style="margin:0 0 10px"><header><span class="ids">' + idc(pr.id) + "</span>" + chip("atencao", pr.kind) + "</header>" +
    '<h3 class="card-title">' + esc(pr.summary) + "</h3>" +
    '<p class="muted small">' + (pr.target ? "alvo " + esc(pr.target) + " · " : "") + (pr.into ? "em " + esc(pr.into) + " · " : "") +
    "evidência: " + esc(pr.evidence || "—") + "</p>" +
    '<div class="ask-opts"><button class="btn primary" data-acc>aceitar (gate)</button><button class="btn" data-rej>rejeitar</button></div></div>').join("")
    : empty("nenhuma proposta aberta"), ' style="margin-top:14px"');
  const pubs = M.publishes || [];
  if (pubs.length) h += panel("Publicar (porta 3) · " + pubs.filter(x => x.status !== "publicada").length + " aguardando",
    pubs.map(x => '<div class="card" style="margin:0 0 10px"><header><span class="ids">' + idc(x.id) + "</span>" +
      chip(x.status === "solicitada" ? "atencao" : x.status === "publicada" ? "em-dia" : "info", x.status) +
      ' <span class="muted small">→ ' + esc(x.to) + "</span></header>" +
      '<h3 class="card-title">' + esc(x.title) + "</h3>" +
      (x.link ? '<p class="muted small">' + esc(x.link) + "</p>" : "") +
      '<div class="ask-opts">' +
      (x.status === "solicitada" ? '<button class="btn primary" data-pub="approve:' + esc(x.id) + '">aprovar (gate)</button><button class="btn" data-pub="cancel:' + esc(x.id) + '">cancelar</button>' : "") +
      (x.status === "aprovada" ? '<button class="btn primary" data-pub="done:' + esc(x.id) + '">publicar (agente)</button><button class="btn" data-pub="cancel:' + esc(x.id) + '">cancelar</button>' : "") +
      (x.status === "publicada" ? '<a class="btn" href="' + esc(x.link || "#") + '">abrir ↗</a>' : "") +

  return h;
};

// ── router + faces (mesma lógica da TUI: Execução | Portfólio, cada face lembra onde estava) ──
const TABS_EXEC = [["home", "Início"], ["todo", "TODO", () => M.counts.mine_overdue], ["projects", "Projetos"], ["decisions", "Decisões"], ["ask", "Perguntas", () => ((M.questions || []).filter(q => q.status === "aberta").length + M.proposals.length) || 0], ["wins", "Conquistas"],
  ["people", "Pessoas"], ["timeline", "Linha do tempo"], ["focus", "Foco", () => M.focus && M.focus.status === "proposto" ? 1 : 0],
  ["outbox", "Mensagens", () => M.counts.outbox_pending], ["health", "Saúde", () => (M.health || []).filter(c => c.level !== "ok").length]];
const TABS_PF = [["pf/visao", "Visão geral"], ["pf/opps", "Oportunidades", () => PF.opportunities.filter(o => o.status !== "descartada").length],
  ["pf/matrix", "Matriz"], ["pf/procs", "Processos", () => PF.processes.filter(p => p.status === "ativo").length], ["pf/areas", "Áreas", () => PF.areas.length]];
const FACES = [["execucao", "Execução", TABS_EXEC], ["portfolio", "Portfólio", TABS_PF]];
if (window.PF_ONLY) { FACES.length = 0; FACES.push(["portfolio", "Portfólio", TABS_PF]); }
const faceOf = v => v.indexOf("pf/") === 0 ? "portfolio" : "execucao";
const PARENT = {project: "projects", person: "people", action: "todo", decision: "decisions", "pf/opp": "pf/opps", "pf/area": "pf/areas"};
function go(view, params){ const q = new URLSearchParams(Object.entries(params || {}).filter(([, v]) => v)).toString(); location.hash = view + (q ? "?" + q : ""); }
function route(){
  const raw = location.hash.slice(1) || "home", parts = raw.split("?"), path = parts[0], qs = parts[1] || "";
  let seg = path.split("/");
  if (seg[0] === "face") {                       // trocar de face: volta pra onde a face estava
    const f = FACES.some(x => x[0] === seg[1]) ? seg[1] : "execucao";
    const last = localStorage.getItem("mock-face-" + f);
    location.hash = last || (f === "portfolio" ? "pf/visao" : "home");
    return;
  }
  if (seg[0] === "portfolio") seg = ["pf", "visao"];          // link antigo
  const pf = seg[0] === "pf";
  let view = pf ? "pf/" + (seg[1] || "visao") : seg[0];
  const arg = pf ? seg.slice(2).join("/") : seg.slice(1).join("/");
  const q = new URLSearchParams(qs);
  if (!V[view]) view = "home";
  if (window.PF_ONLY && faceOf(view) === "execucao") { location.hash = "#pf/visao"; return; }
  localStorage.setItem("mock-face-" + faceOf(view), raw);
  if (typeof window.renderTabs === "function")
    window.renderTabs(view, (FACES.find(f => f[0] === faceOf(view)) || FACES[0])[2], PARENT);
  if (typeof window.renderFaces === "function") window.renderFaces(faceOf(view));
  $("#view").innerHTML = V[view](q, arg && decodeURIComponent(arg));
  if (typeof window.afterRoute === "function") window.afterRoute(view, q, arg);
  window.scrollTo(0, 0);
}
window.BRAIN = {M, A, D, P, G, PE, OPP, PROC, AREA, go, route, chip, aL, dL, pL, peL, fmtD, fmtDW, donut, bar, esc,
  refresh: function(nm){                       // ponte CLI (./brain serve): novo view model → índices + views
    normalizeBrain(nm);
    for (const k of Object.keys(M)) delete M[k];
    Object.assign(M, nm);
    A = idx(M.actions); D = idx(M.decisions); P = idx(M.projects); G = idx(M.goals);
    PE = idx(M.people); ART = idx(M.artifacts); DL = idx(M.deliveries); DD = idx(M.deliverables_done);
    PF = M.portfolio; AREA = idx(PF.areas); OPP = idx(PF.opportunities); PROC = idx(PF.processes);
    BRAIN.A = A; BRAIN.D = D; BRAIN.P = P; BRAIN.G = G; BRAIN.PE = PE;   // re-exporta: quem lê
    BRAIN.OPP = OPP; BRAIN.PROC = PROC; BRAIN.AREA = AREA;              // window.BRAIN não pode ficar congelado no boot
    route();
  }};

// tema (claro/escuro manual + automático)
const themeBtn = $("#theme");
function applyTheme(t){ document.documentElement.dataset.theme = t; if (themeBtn) { themeBtn.textContent = "☀"; themeBtn.title = t === "dark" ? "tema escuro — clique p/ claro" : "tema claro — clique p/ escuro"; themeBtn.classList.toggle("is-dark", t === "dark"); } }
let theme = localStorage.getItem("mock-theme") ||
  (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
applyTheme(theme);
if (themeBtn) themeBtn.onclick = () => { theme = theme === "dark" ? "light" : "dark"; localStorage.setItem("mock-theme", theme); applyTheme(theme); };

// busca
const qi = $("#q");
if (qi) {
  let tmr;
  qi.addEventListener("input", e => { clearTimeout(tmr); const v = e.target.value.trim(); tmr = setTimeout(() => v.length > 1 ? go("search", {q: v}) : go("home"), 250); });
  document.addEventListener("keydown", e => {
    if (e.key === "/" && !/input|textarea|select/i.test(document.activeElement.tagName)) { e.preventDefault(); qi.focus(); }
    if (e.key === "Escape" && document.activeElement === qi) { qi.value = ""; go("home"); qi.blur(); }
  });
}
window.addEventListener("hashchange", route);
route();
})();
</script>
