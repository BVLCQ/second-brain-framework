# Serviços locais do Segundo Cérebro (OrbStack / Docker — o `docker` do OrbStack serve).
#   docker compose -f services/compose.yaml up -d                                    ← modo embed (sem LLM)
#   docker compose -f services/compose.yaml -f services/compose.full.yaml up -d      ← modo full (LLM do dono)
# O LM Studio roda no Mac (Metal); o container o alcança por host.docker.internal.
name: segundo-cerebro

services:
  hindsight:
    # Pin por digest (emenda R5 do plano da memória: tag pode ser reempurrada; digest não).
    # Tag correspondente: 1.2.0-slim — fixa a regressão upstream #5738 (tool_choice forçado
    # quebrava reflect no Sonnet/Opus desde a 0.10.2; resolvida na 1.1.0) e traz os mental
    # models endurecidos, datas no fuso do conteúdo e schema-por-resposta universal.
    image: ghcr.io/vectorize-io/hindsight@sha256:c7d494c309fde53d07e79158be08d7a61f3f309b23cc417c7e4b0b8fc8adc77a
    container_name: hindsight
    restart: unless-stopped
    # Colisão de nome/porta (decisão 10 do plano da memória): máquina que já roda outro
    # Hindsight no :8888 deve ADOTAR o servidor existente ([memory].url aponta pra ele) ou
    # sobrepor as portas abaixo por env — nunca dois containers reclamando "hindsight"/8888.
    ports:
      - "127.0.0.1:${HINDSIGHT_API_PORT:-8888}:8888"   # API (o brain usa [memory].url)
      - "127.0.0.1:${HINDSIGHT_UI_PORT:-9999}:9999"    # UI
    environment:
      HINDSIGHT_API_LLM_PROVIDER: lmstudio
      HINDSIGHT_API_LLM_BASE_URL: http://host.docker.internal:1234/v1
      HINDSIGHT_API_LLM_MODEL: qwen/qwen3-4b-2507
      HINDSIGHT_API_LLM_API_KEY: lm-studio   # placeholder; o LM Studio ignora
      HINDSIGHT_API_LLM_OUTPUT_LANGUAGE: Brazilian Portuguese (pt-BR)
      # Modo embed: os bancos usam chunks, sem consolidação nem observações (brainlib/memory.py NO_LLM_CONFIG):
      # o LLM abaixo não é chamado — pode ficar descarregado no LM Studio. Só o bge-m3 (embeddings, ~635 MB)
      # precisa estar disponível. O tuning que continha o qwen3-4b na consolidação está no git history.
      HINDSIGHT_API_SKIP_LLM_VERIFICATION: "true"
      # Id fixo do worker. O padrão é o hostname (= id do container, muda a cada recreate) e o
      # worker só recupera, ao subir, as operações que ele mesmo tinha pego — com id novo, a
      # consolidação em andamento ficava presa em "processing" para sempre.
      HINDSIGHT_API_WORKER_ID: hindsight
      # Idiomas usados aqui: pt-BR, es, en — modelos multilíngues.
      # Provedores (plano memory-providers.md): o wizard e o `brain memory providers set` gravam no
      # config/.env; o bloco env_file abaixo injeta TODAS as chaves HINDSIGHT_API_* dele no container
      # (dims, candidatos, modelos por operação, wire do reranker…). Os cinco campos abaixo são o
      # stack local de fábrica: valem quando o .env não define — `environment:` vence `env_file:`,
      # então recrie SEMPRE com --env-file config/.env depois de trocar de provedor.
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: ${HINDSIGHT_API_EMBEDDINGS_PROVIDER:-openai}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL: ${HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL:-http://host.docker.internal:1234/v1}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL: ${HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL:-text-embedding-bge-m3}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY: ${HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY:-lm-studio}
      # Reranker desligado por padrão = fusão RRF (benchmark 2026-11-07: local reprovado no gate de
      # 400 ms; nuvem — Fireworks Qwen3-Reranker-8B, Cohere, ZeroEntropy… — entra pelo config/.env).
      HINDSIGHT_API_RERANKER_PROVIDER: ${HINDSIGHT_API_RERANKER_PROVIDER:-rrf}
    env_file:
      # config da instância (chaves de provedor) — relativo a services/: ../config/.env.
      # required: false: instância sem .env sobe com o stack local de fábrica.
      - path: ../config/.env
        required: false
    volumes:
      - hindsight-data:/home/hindsight/.pg0
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if b'connected' in urllib.request.urlopen('http://127.0.0.1:8888/health', timeout=5).read() else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  hindsight-data:
