# Serviços locais do Segundo Cérebro (OrbStack / Docker).
#   docker compose -f services/compose.yaml up -d
# O LM Studio roda no Mac (Metal); o container o alcança por host.docker.internal.
name: segundo-cerebro

services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:0.10.3
    container_name: hindsight
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8888"   # API (o brain usa http://localhost:8888)
      - "127.0.0.1:9999:9999"   # UI
    environment:
      HINDSIGHT_API_LLM_PROVIDER: lmstudio
      HINDSIGHT_API_LLM_BASE_URL: http://host.docker.internal:1234/v1
      HINDSIGHT_API_LLM_MODEL: qwen/qwen3-4b-2507
      HINDSIGHT_API_LLM_API_KEY: lm-studio   # placeholder; o LM Studio ignora
      HINDSIGHT_API_LLM_OUTPUT_LANGUAGE: Brazilian Portuguese (pt-BR)
      # Os bancos usam chunks, sem consolidação nem observações (brainlib/memory.py NO_LLM_CONFIG): o LLM abaixo
      # não é chamado — pode ficar descarregado no LM Studio. Só o bge-m3 (embeddings, ~635 MB) precisa estar disponível.
      # O tuning que continha o qwen3-4b na consolidação (batch 3, orçamentos 256/1024/128, concorrência 4,
      # timeout 300) foi aposentado — está no git history se a extração por LLM voltar.
      # Sem consolidação/extração o LLM não é usado: não verifica nem carrega o modelo ao subir.
      HINDSIGHT_API_SKIP_LLM_VERIFICATION: "true"
      # Id fixo do worker. O padrão é o hostname (= id do container, muda a cada recreate) e o
      # worker só recupera, ao subir, as operações que ele mesmo tinha pego — com id novo, a
      # consolidação em andamento ficava presa em "processing" para sempre.
      HINDSIGHT_API_WORKER_ID: hindsight
      # Idiomas usados aqui: pt-BR, es, en — modelos multilíngues.
      # Embeddings bge-m3 (1024 dims) servidos pelo LM Studio (Metal), não pela CPU do container.
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: openai
      HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL: http://host.docker.internal:1234/v1
      HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL: text-embedding-bge-m3
      HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY: lm-studio
      # Reranker desligado (fusão RRF dos retrievers). Benchmark no M4 Pro, out/2026, pt/es/en:
      #   bge-m3 sozinho: 91,7% top-1 nas perguntas difíceis, ~15 ms por consulta
      #   + bge-reranker-v2-m3 (CPU do container): 95,8%, mas 1,6 s @30 e 15 s @300 candidatos
      #   rerankers menores (mMiniLM, Qwen3-Reranker-0.6B) pioraram o acerto.
      # Container não usa a GPU do Mac; reranker neural só valeria servido no host com Metal.
      HINDSIGHT_API_RERANKER_PROVIDER: rrf
    volumes:
      - hindsight-data:/home/hindsight/.pg0
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if b'connected' in urllib.request.urlopen('http://127.0.0.1:8888/health', timeout=5).read() else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  hindsight-data:
